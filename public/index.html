<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NorthPoint President's Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: slide-style page. Header → escalations → other issues → Commercial → Cost → Operations. */
:root{
  --ink:#000000; --deep:#051C2C; --grey-text:#595959; --na:#A6A6A6; --card-bg:#F2F2F2;
  --rule:#D9D9D9; --rule-strong:#7F7F7F; --neg:#C00000;
  --dot-green:#2E9B4F; --dot-amber:#F2A900; --dot-red:#D7342A; --dot-nodata:#8C8C8C;
  --bg:#FFFFFF; --soft:#F6F7F8; --chg:#FFF3C4; --focus:#1F5FBF; --lit:#EAF1F7;
  --ok-bg:#E5F3E9; --ok-fg:#1D6232; --warn-bg:#FCF0D2; --warn-fg:#6E4E00; --bad-bg:#FBE3E1; --bad-fg:#9A1F17; --off-bg:#ECEDEE; --off-fg:#595959; --act-bg:#E3EAF0; --act-fg:#051C2C;
  --serif:Georgia,"Times New Roman",serif; --sans:Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.4;color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- bar ---------- */
.bar,.page{max-width:1280px;margin-left:auto;margin-right:auto;padding-left:8px;padding-right:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--grey-text)}
.brand{font-weight:700;color:var(--ink);letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:10px;background:var(--soft);white-space:nowrap;border:0;font:inherit;color:inherit}
button.chip{cursor:pointer}
button.chip:hover{background:#ECEEF0}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}
.chip .dot{width:8px;height:8px;cursor:default}
.sp{flex:1}
.segv{display:inline-flex;border:1px solid var(--rule-strong);border-radius:2px;overflow:hidden}
.segv button{border:0;background:#fff;color:var(--grey-text);font:700 11px var(--sans);padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.segv button[aria-pressed="true"]{background:var(--deep);color:#fff}
.btn{font:700 12px/1 var(--sans);padding:8px 12px;border:1px solid var(--deep);background:#fff;color:var(--deep);border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--deep);color:#fff}
.btn.primary:hover{background:#0B2F48}
.btn.sm{padding:6px 10px;font-size:11px}
.btn.xs{padding:4px 8px;font-size:10px}
.btn.ghost{border-color:transparent;text-decoration:underline;padding-inline:6px;background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lnk{color:var(--deep);font-weight:700;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font-size:12px}
#vmenu{position:fixed;z-index:86;background:#fff;border:1px solid var(--rule-strong);box-shadow:0 8px 24px rgba(5,28,44,.18);width:300px;font-size:12px;max-height:60vh;overflow:auto}
#vmenu .vh{padding:8px 12px;font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--grey-text);border-bottom:1px solid var(--rule)}
#vmenu .vi{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule)}
#vmenu .vi:last-child{border-bottom:0}
#vmenu .vi b{min-width:26px}
#vmenu .vi .muted{flex:1}
#vmenu .vc{padding:8px 12px;background:var(--soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- page ---------- */
.page{padding-block:20px 40px}
.draftbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--chg);border:1px solid #EAD48A;padding:8px 12px;font-size:12px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.draftbar .save{color:var(--grey-text)}
.draftbar ul{flex-basis:100%;margin:4px 0 0;padding-left:18px;max-height:140px;overflow:auto}
.kicker{font-size:12px;letter-spacing:.08em;color:var(--grey-text);text-transform:uppercase}
h1{font:700 30px/1.2 var(--serif);margin:6px 0 0;max-width:1040px;text-wrap:balance}
.lbl{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--grey-text);margin:24px 0 8px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--card-bg);padding:16px;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:inset 0 0 0 1px var(--rule-strong)}
.card.lit{outline:2px solid var(--deep)}
.ct{display:flex;align-items:center;gap:10px;font:700 15px/1.25 var(--sans);text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px}
.cb{flex:none;width:24px;height:24px;border-radius:50%;background:var(--deep);color:#fff;font:700 13px/24px var(--sans);text-align:center}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;margin-top:10px;font-size:14px}
.kv>span:first-child{font:700 11px/1.7 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--grey-text)}
.kv .b{font-weight:700}
.cf{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--grey-text);font-size:11px}
.hint{color:var(--grey-text);font-size:11px;margin-left:auto}
[contenteditable="true"]{outline:1px dashed #B9A85A;outline-offset:2px;border-radius:1px;cursor:text}
[contenteditable="true"]:focus{outline:2px solid var(--focus);background:#fff}

/* other issues */
.issues{margin-top:16px;border:1px solid var(--rule)}
.ih{width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:0;padding:10px 14px;cursor:pointer;text-align:left;font-size:13px}
.ih b{font:700 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.ih .cnt{background:var(--deep);color:#fff;border-radius:9px;padding:1px 7px;font:700 11px var(--sans)}
.ih .src{color:var(--grey-text);font-size:12px}
.ih .chev{margin-left:auto;color:var(--grey-text)}
.il{list-style:none;margin:0;padding:0 14px;border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.il li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px 10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.il li.lit{background:var(--lit)}
.il .dot{margin-top:4px;cursor:default}
.il .t{font-weight:700;font-size:13px}
.il .kv{grid-template-columns:78px minmax(0,1fr);margin-top:6px;font-size:13px;gap:8px}
.il .kv>span:first-child{font-size:10px}
.il .act{grid-column:2;margin-top:8px}
.tag{display:inline-block;font:700 9px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--grey-text);border:1px solid var(--rule-strong);padding:0 4px;border-radius:2px;margin-right:6px;vertical-align:1px;white-space:nowrap}
.ifoot{padding:8px 14px;border-top:1px solid var(--rule);font-size:11px;color:var(--grey-text);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--grey-text);margin:28px 0 0;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{cursor:default}
.tt{display:flex;align-items:baseline;gap:12px;margin:30px 0 6px;flex-wrap:wrap;scroll-margin-top:70px}
.tt .n{font:400 30px/1 var(--serif)}
.tt h2{font:700 15px var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:0}
.tt h3{font:700 13px var(--sans);margin:0}
.tt .note{font-size:12px;color:var(--grey-text)}
.tt.sub{margin-top:22px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tr{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tr th{font:400 11px var(--sans);text-transform:uppercase;letter-spacing:.03em;color:var(--grey-text);text-align:left;padding:4px 8px;vertical-align:bottom;background:#fff;white-space:nowrap}
.tr th.r{text-align:right}.tr th.c{text-align:center}
.tr th.g{font-weight:700;color:var(--ink);text-transform:none;font-size:12px;letter-spacing:0}
.tr tr.grp th{padding-bottom:0}
.tr tr.grp th span{display:block;border-bottom:1px solid var(--rule-strong);padding-bottom:3px;text-align:center;font-weight:700;color:var(--ink)}
.tr tr.cols th{border-bottom:2px solid var(--deep);padding-bottom:6px}
.tr td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:middle;position:relative;background:#fff}
.tr tr{scroll-margin-top:90px}
.tr td.num{text-align:right;white-space:nowrap}
.tr td.ctr{text-align:center;white-space:nowrap}
.tr .sticky{position:sticky;left:0;z-index:1}
.tr td.sticky{min-width:220px}
body.edit .tr td.sticky{min-width:250px}
.tr th.sticky{z-index:2}
.tr tr.sh th{background:#fff;padding:12px 8px 6px;border-bottom:1.5px solid var(--rule-strong);text-transform:none;letter-spacing:0;color:var(--ink);font-size:13px;vertical-align:middle}
.tr tr.sub2 td{font-size:11px;color:var(--grey-text);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding-top:10px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.tr tr.tot td{border-top:1.5px solid var(--rule-strong);font-weight:700}
.shi{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tog{border:0;background:none;padding:0;font:700 13px var(--sans);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-align:left}
.tog .cv{display:inline-block;width:14px;color:var(--grey-text);transition:transform .15s}
.tog[aria-expanded="false"] .cv{transform:rotate(-90deg)}
.csum{font-weight:400;color:var(--grey-text);font-size:12px;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.tf{font:12px var(--sans);padding:4px 8px;border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink)}
.m{font-weight:700}
tr.child .m{font-weight:400;padding-left:20px;display:inline-block}
.sub{display:block;font-size:11px;color:var(--grey-text);font-weight:400}
.na{color:var(--na)}
.b{font-weight:700}
.neg{color:var(--neg)}
.drv{font-size:12px;color:var(--grey-text);white-space:normal;min-width:240px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;cursor:help}
.dot.green{background:var(--dot-green)}.dot.amber{background:var(--dot-amber)}.dot.red{background:var(--dot-red)}
.dot.nodata{background:transparent;border:1.5px dotted var(--dot-nodata)}
.dot:focus-visible,.vt:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:50%}
.vt{cursor:help;display:inline-block}
.dotbtn{border:1px dashed #C8B66A;background:none;padding:4px 6px;border-radius:2px;cursor:pointer;line-height:0}
.dotbtn .plus{display:inline-block;width:10px;height:10px;line-height:10px;font-size:12px;color:#B7A24E}
td.chg{background:var(--chg)!important}
.ci{width:76px;text-align:right;border:0;border-bottom:1px dashed #B9A85A;background:transparent;font:inherit;font-weight:700;padding:2px 0;color:var(--ink)}
.ci.plain{font-weight:400}
.ci.date{width:122px;text-align:left;font-weight:400}
.ci.w{width:44px}
.ci.s{width:54px;font-weight:400}
.ci:focus{outline:2px solid var(--focus);background:#fff}
.osel{font:inherit;font-size:13px;border:0;border-bottom:1px dashed #B9A85A;background:transparent;padding:2px 0;max-width:210px;color:inherit}
.auto{font-size:10px;color:var(--grey-text);text-transform:uppercase;letter-spacing:.04em;display:block}
.pend{font-size:12px;color:var(--grey-text);padding:8px 0}
.foot{font-size:11px;color:var(--grey-text);margin:8px 0 0}

/* focus mode */
.dimmable{transition:opacity .15s}
body.focusing .dimmable:not(.lit){opacity:.32}
body.focusing tr.lit td{background:var(--lit)}
body.focusing tr.lit td:first-child{box-shadow:inset 3px 0 0 var(--deep)}
#callouts{position:fixed;inset:0;pointer-events:none;z-index:60}
.co{position:fixed;background:var(--deep);color:#fff;font:700 12px/1.3 var(--sans);padding:5px 9px 5px 5px;border-radius:2px;display:flex;align-items:center;gap:7px;max-width:230px;box-shadow:0 3px 10px rgba(5,28,44,.25);animation:pop .14s ease-out}
.co::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--deep)}
.co.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--deep)}
.co .cn{flex:none;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--deep);font:700 11px/20px var(--sans);text-align:center}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.96)}to{opacity:1;transform:none}}
.focusbar{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:#fff;border:1px solid var(--deep);box-shadow:0 6px 18px rgba(0,0,0,.15);padding:6px 8px 6px 12px;font-size:12px;display:flex;gap:10px;align-items:center}

/* operations */
tr.proj td{border-top:1.5px solid var(--rule-strong);padding-top:10px;padding-bottom:10px}
tr.stage td{font-size:12px;padding-top:5px;padding-bottom:5px;border-bottom-color:#ECECEC}
tr.stage .sn{padding-left:22px;display:block}
.sc{display:inline-block;font:700 10px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;padding:4px 7px;border-radius:10px;white-space:nowrap}
.sc.done{background:var(--ok-bg);color:var(--ok-fg)}.sc.active{background:var(--act-bg);color:var(--act-fg)}.sc.planned{background:#fff;color:var(--grey-text);border:1px solid var(--rule)}
.sc.blocked{background:var(--bad-bg);color:var(--bad-fg)}.sc.noupdate{background:var(--off-bg);color:var(--off-fg)}.sc.late{background:var(--warn-bg);color:var(--warn-fg)}
.nl{display:block;font-size:12px;margin:1px 0}
table.ops td:nth-child(6){min-width:270px}
table.ops td:nth-child(4){white-space:nowrap}
.nl .tag{margin-right:5px}
.tag.red{border-color:var(--dot-red);color:var(--bad-fg);background:var(--bad-bg)}
.tag.amber{border-color:var(--dot-amber);color:var(--warn-fg);background:var(--warn-bg)}
.tag.nodata{border-style:dotted}
button.tag{cursor:pointer;font:700 9px/1.4 var(--sans)}
.blk{color:var(--neg)}
.nt{color:var(--grey-text)}
.tlh{position:relative;height:16px;min-width:340px}
.tlh span{position:absolute;bottom:0;font-size:10px;color:var(--grey-text);transform:translateX(2px);white-space:nowrap;text-transform:none;letter-spacing:0}
.tlh i{position:absolute;bottom:-6px;height:6px;border-left:1px solid var(--rule-strong)}
.tlh .td{color:var(--neg);font-weight:700;transform:translateX(-50%);bottom:auto;top:-14px}
.tl{position:relative;height:20px;min-width:340px}
.tl .g{position:absolute;top:0;bottom:0;border-left:1px solid #EFEFEF}
.tl .seg{position:absolute;top:5px;height:10px;border-radius:2px;min-width:3px}
.seg.done{background:var(--dot-green)}.seg.active{background:var(--deep)}.seg.planned{background:#fff;border:1.5px solid var(--rule-strong)}
.seg.blocked{background:var(--dot-red)}.seg.late{background:var(--dot-amber)}
.seg.noupdate{background:repeating-linear-gradient(45deg,#B5B5B5 0 3px,#E4E4E4 3px 6px)}
.tl .ms{position:absolute;top:4px;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);border:1.5px solid var(--deep);background:#fff}
.tl .ms.done{background:var(--dot-green);border-color:var(--dot-green)}.tl .ms.blocked{background:var(--dot-red);border-color:var(--dot-red)}.tl .ms.noupdate{background:#BDBDBD;border-color:#8C8C8C}
.tl .dl{position:absolute;top:0;bottom:0;border-left:2px solid var(--deep)}
.tl .dl::after{content:"";position:absolute;top:-1px;left:-5px;border:4px solid transparent;border-top:6px solid var(--deep)}
.tl .now{position:absolute;top:-6px;bottom:-6px;border-left:1.5px dashed var(--neg)}
.tlleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--grey-text);margin-top:8px;align-items:center}
.lsw{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ssel{font:11px var(--sans);padding:2px 4px;border:1px dashed #B9A85A;background:#fff;border-radius:2px}

/* tooltip, popover, toast */
#tip{position:fixed;z-index:80;background:var(--deep);color:#fff;font:700 12px/1.35 var(--sans);padding:6px 8px;border-radius:2px;max-width:240px;pointer-events:none;left:0;top:0}
#tip::after{content:"";position:absolute;left:var(--ax,50%);transform:translateX(-50%);border:6px solid transparent}
#tip[data-pos="top"]::after{top:100%;border-top-color:var(--deep)}
#tip[data-pos="bottom"]::after{bottom:100%;border-bottom-color:var(--deep)}
#pop{position:fixed;z-index:85;background:#fff;border:1px solid var(--rule-strong);box-shadow:0 8px 24px rgba(5,28,44,.18);padding:10px;width:260px;font-size:12px}
#pop .opts{display:grid;gap:2px;margin-bottom:8px}
#pop .opt{display:flex;align-items:center;gap:8px;border:0;background:none;padding:5px 6px;text-align:left;cursor:pointer;font-size:12px;border-radius:2px}
#pop .opt:hover,#pop .opt[aria-pressed="true"]{background:var(--soft)}
#pop .opt[aria-pressed="true"]{font-weight:700}
#pop label{display:block;font-weight:700;color:var(--grey-text);font-size:11px;margin:6px 0 3px}
#pop textarea,#pop select{width:100%;font:12px var(--sans);padding:5px;border:1px solid #B5B5B5;border-radius:2px}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;font:700 13px var(--sans);padding:10px 14px;border-radius:2px;z-index:95;max-width:calc(100vw - 32px);box-shadow:0 6px 18px rgba(0,0,0,.2)}

/* follow-up modal */
.modal{position:fixed;inset:0;z-index:90;background:rgba(5,28,44,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(32px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.mbox{background:#fff;width:min(640px,100%);box-shadow:0 18px 50px rgba(0,0,0,.3)}
.mh{padding:16px 20px 12px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.mh h3{font:700 18px/1.25 var(--serif);margin:0}
.mb{padding:14px 20px;display:grid;gap:10px}
.fr{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center}
.fr>span{font:700 11px var(--sans);color:var(--grey-text);text-transform:uppercase;letter-spacing:.05em}
.in{width:100%;font:13px var(--sans);padding:7px 9px;border:1px solid #B5B5B5;border-radius:2px;background:#fff;color:var(--ink);min-width:0}
.in:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus)}
textarea.in{resize:vertical;line-height:1.5}
.dd{position:relative}
.ddb{width:100%;text-align:left;font:13px var(--sans);padding:7px 28px 7px 9px;border:1px solid #B5B5B5;border-radius:2px;background:#fff;cursor:pointer;position:relative;color:var(--ink)}
.ddb::after{content:"▾";position:absolute;right:10px;top:7px;color:var(--grey-text)}
.ddb .ph{color:#8a8a8a}
.ddm{position:absolute;left:0;right:0;top:calc(100% + 2px);background:#fff;border:1px solid var(--rule-strong);box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:5;padding:4px 0}
.ddm label{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;font-size:13px}
.ddm label:hover{background:var(--soft)}
.ddm small{color:var(--grey-text);margin-left:auto}
.ddm .ce{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px;padding:6px 10px}
.ddm .lnk{margin:6px 10px}
.mf{padding:12px 20px;border-top:1px solid var(--rule);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:1100px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} .il{grid-template-columns:minmax(0,1fr)} }
@media (max-width:700px){
  .bar,.page{padding-left:0;padding-right:0}
  .cards{grid-template-columns:minmax(0,1fr)}
  h1{font-size:24px}
  .fr{grid-template-columns:1fr;gap:4px}
}

const titleCase = s => String(s).toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase()).replace(/Northpoint/g, "NorthPoint").replace(/\bq3\b/ig, "Q3");
function pd(iso){ if(!iso) return null; const [y,m,d] = String(iso).slice(0,10).split("-").map(Number); return { y, m, d }; }
function fmtDate(iso){ const p = pd(iso); return p ? `${p.d} ${MON[p.m-1]}` : null; }
function fmtLong(iso){ const p = pd(iso); return p ? `${p.d} ${MON[p.m-1]} ${p.y}` : ""; }

/* ---------- data model ---------- */
function normRow(r){
  const o = Object.assign({ child:false, parent:null, period:null, field:"actual", better:"higher", fmt:"usd", plan:null, actual:null, forecast:null,

  if(d.opsNote == null) d.opsNote = DATA.opsNote;

function sections(d){ return [...d.commercial, ...d.cost]; }

function findRow(d, id){ return allRows(d).find(r => r.id === id) || null; }
function findProj(d, id){ return d.operations.find(p => p.id === id) || null; }
function children(d, row){ return allRows(d).filter(r => r.parent === row.id); }
function ownerOf(r){ return r.owners[r.owner || 0] || null; }

function val(d, row, f){
  if(row.derive){ const a = findRow(d, row.derive.num), b = findRow(d, row.derive.den); if(!a || !b) return null; const x = val(d, a, f), y = val(d, b, f); return blank(x) || blank(y) || !+y ? null : x / y; }
  if(f === "forecast" && !blank(row.dealValue) && !blank(row.weight)) return r1(+row.dealValue * +row.weight / 100);
  if(f === row.field && row.owners.length){ const o = ownerOf(row); if(o && "value" in o) return blank(o.value) ? null : +o.value; }
  else if(!blank(row[f])) return +row[f];
  if(row.rollup){ const ch = children(d, row).map(c => val(d, c, f)).filter(x => !blank(x)); if(ch.length) return r1(ch.reduce((a, b) => a + b, 0)); }

}

  if(row.fmt === "accounts") return (v > 0 ? "+" : v < 0 ? MINUS : "") + r1(Math.abs(v)) + "M";
  return smoney(v) + (row.perMonth ? "/mo" : "");
}
function variance(d, row){
  const p = val(d, row, "plan"); let basis = "actual", v = val(d, row, "actual");
  if(blank(v)){ basis = "forecast"; v = val(d, row, "forecast"); }
  if(blank(p) || blank(v)) return null;
  const diff = row.fmt === "usd" ? r1(v - p) : v - p, pct = p ? (v - p) / p * 100 : 0, rp = Math.round(pct);
  const adverse = row.better === "lower" ? diff > 1e-9 : diff < -1e-9;
  return { main: rp < 0 ? `(${-rp}%)` : rp > 0 ? `+${rp}%` : "0%", sub: fmtDiff(row, diff), adverse, diff, pct: rp, basis };
}
function dealOf(d, row){
  if(!blank(row.dealValue)) return +row.dealValue;
  if(row.rollup){ const ch = children(d, row); if(ch.length && ch.every(c => !blank(c.dealValue))) return r1(ch.reduce((a, c) => a + +c.dealValue, 0)); }

  if(!blank(row.weight)) return +row.weight;
  const dv = dealOf(d, row), w = val(d, row, "forecast");

}
function shareOf(d, row){
  if(row.fmt !== "usd" || row.perMonth) return null;
  const w = val(d, row, "forecast"); if(blank(w)) return null;
  if(row.rollup){ const p = val(d, row, "plan"); return { main:"100%", sub: p ? `covers ${Math.round(w / p * 100)}% of plan` : "" }; }
  if(!row.parent) return null;
  const par = findRow(d, row.parent), tot = par ? val(d, par, "forecast") : null, p = par ? val(d, par, "plan") : null;
  if(!tot) return null;
  return { main: Math.round(w / tot * 100) + "%", sub: p ? `${Math.round(w / p * 100)}% of plan` : "" };
}

/* What each cell shows; used for rendering and for marking draft changes. */
function cellData(d, row){
  const t = c => row.tips[c] || {};
  const o = ownerOf(row), v = variance(d, row), sh = shareOf(d, row);
  return {
    metric:{ t: row.metric },
    plan:{ t: fmtV(row, val(d, row, "plan")) }, actual:{ t: fmtV(row, val(d, row, "actual")) }, forecast:{ t: fmtV(row, val(d, row, "forecast")) },
    var: v ? Object.assign({}, v, { tip:(row.varTip || {}).text || "", esc:(row.varTip || {}).esc || null }) : { main:null },
    deal:{ t: money(dealOf(d, row)) }, weight:{ t: blank(weightOf(d, row)) ? null : weightOf(d, row) + "%" },
    share:{ t: sh ? sh.main : null, sub: sh ? sh.sub : null },
    annual:{ t: row.perMonth && v ? smoney(v.diff * 12) : null, adverse: v && v.adverse },
    concentration:{ st: row.risk.concentration, tip: t("concentration").text || "", esc: t("concentration").esc || null },
    reporting:{ st: row.risk.reporting, tip: t("reporting").text || "", esc: t("reporting").esc || null },
    staffing:{ st: row.risk.staffing, tip: t("staffing").text || "", esc: t("staffing").esc || null },

    updated:{ t: fmtDate(row.updated), stale: !!row.updated && !!d.meta.asOf && row.updated < d.meta.asOf }
  };
}
function cellText(c){
  if(!c) return "";
  if("st" in c) return c.st ? STATUS[c.st] + (c.tip ? " · " + c.tip : "") : "";
  if("main" in c) return (c.main || "") + (c.sub ? " " + c.sub : "") + (c.tip ? " · " + c.tip : "");

}

/* ---------- NorthPoint cost to serve (deal model) ---------- */
function costCalc(d){
  const m = d.costModel, offer = m.offers[S.offer] || m.offers.sales;
  const ceil = x => Math.ceil(x - 1e-9);
  const lines = { cloud:[], env:[], lic:[], sup:[], impl:[], total:[], rev:[], margin:[] }, am = [];
  m.years.forEach((y, i) => {
    const acc = +m.accounts[i] || 0, a = acc * 12; am.push(a);
    const cloud = +m.cloudPerAcct * (1 + (+m.cloudPremium || 0) / 100);
    const env = a ? Math.max(+m.envMin, ceil(acc / +m.envCapacity)) * +m.envCost / a : 0;
    const lic = +m.licPerAcct;
    const sup = a ? Math.max(+m.supportMin, ceil(acc / +m.supportCapacity)) * +m.supportCost / a : 0;
    const impl = i === 0 && a ? +m.implRate * +m.implMonths / a : 0;
    const total = cloud + env + lic + sup + impl, rev = +offer.revenue[i] || 0;
    lines.cloud.push(cloud); lines.env.push(env); lines.lic.push(lic); lines.sup.push(sup); lines.impl.push(impl); lines.total.push(total); lines.rev.push(rev); lines.margin.push(rev ? 1 - total / rev : null);
  });
  const tam = am.reduce((a, b) => a + b, 0), five = {}, totals = {};
  Object.keys(lines).forEach(k => { if(k === "margin") return; totals[k] = lines[k].reduce((s, v, i) => s + v * am[i], 0); five[k] = tam ? totals[k] / tam : 0; });
  five.margin = five.rev ? 1 - five.total / five.rev : null;
  return { m, offer, lines, five, totals, am };
}

/* ---------- other issues (rule-based fallback; AI replaces these when connected) ---------- */
function knownFigures(d){
  const k = new Set(); const addM = v => { if(!blank(v)){ const m = money(Math.abs(+v)); if(m) k.add(m); } };
  allRows(d).forEach(r => {
    if(r.fmt === "usd"){ ["plan","actual","forecast"].forEach(f => addM(val(d, r, f))); r.owners.forEach(o => addM(o.value)); addM(r.dealValue); }
    if(!blank(r.weight)) k.add(+r.weight + "%");
    const v = variance(d, r); if(v){ k.add(Math.abs(v.pct) + "%"); if(r.fmt === "usd") addM(Math.abs(v.diff)); }
    const sh = shareOf(d, r); if(sh){ k.add(sh.main); (sh.sub.match(/\d+%/g) || []).forEach(x => k.add(x)); }
  });
  d.operations.forEach(p => { if(p.kpi && p.kpi.plan){ const dd = p.kpi.actual - p.kpi.plan; k.add(Math.abs(Math.round(dd / p.kpi.plan * 100)) + "%"); } });
  return k;
}
function escalatedCols(d){
  const out = [];
  allRows(d).forEach(r => { Object.entries(r.tips).forEach(([c, t]) => { if(t && t.esc) out.push({ id:r.id, name:r.metric, col:c, parent:r.parent }); }); if(r.varTip && r.varTip.esc) out.push({ id:r.id, name:r.metric, col:"var", parent:r.parent }); });
  d.operations.forEach(p => Object.entries(p.tips).forEach(([c, t]) => { if(t && t.esc) out.push({ id:p.id, name:p.name, col:c, proj:true }); }));
  return out;
}
function covered(d, id, name, col, parent){
  const nm = String(name).toLowerCase();
  return escalatedCols(d).some(e => e.col === col && (e.id === id || e.id === parent || (nm.length > 4 && (e.name.toLowerCase().includes(nm) || nm.includes(e.name.toLowerCase())))));
}
function ruleIssues(d){
  const out = [], asOf = d.meta.asOf, rb = fmtDow(S.ops.settings.replyBy);
  allRows(d).forEach(r => {
    const reasons = [], o = ownerOf(r), shown = fmtV(r, val(d, r, r.field)); let sev = "medium", topic = "Data reporting", impact = "", next = "";
    const vals = r.owners.filter(x => "value" in x && !blank(x.value)), empty = r.owners.filter(x => "value" in x && blank(x.value));
    const disagree = vals.length > 1 && uniq(vals.map(x => +x.value)).length > 1;
    if(disagree) reasons.push(vals.map(x => `${x.role} reports ${fmtV(r, x.value)}`).join(", "));
    empty.forEach(x => reasons.push(`${x.role} has no figure (${x.source})`));
    COLS.forEach(([c, l]) => { const st = r.risk[c], t = r.tips[c] || {};
      if(!st || st === "green" || t.esc || covered(d, r.id, r.metric, c, r.parent)) return;
      if(t.text && !reasons.some(x => x.includes(t.text))) reasons.push(t.text); if(st === "red") sev = "high"; });
    if(r.child && r.parent && r.fmt === "usd" && blank(r.dealValue) && !blank(val(d, r, "forecast"))) reasons.push("no deal value or weight behind the weighted figure");
    const v = variance(d, r);
    if(r.perMonth && v && v.adverse && Math.abs(v.pct) >= 10){ reasons.unshift(`running ${v.main} over plan`); topic = "Cost"; impact = `At this rate it adds ${smoney(v.diff * 12)} a year over plan.`; sev = Math.abs(v.pct) >= 20 ? "high" : "medium"; }
    if(!reasons.length) return;
    if(!impact){
      if(disagree || empty.length) impact = `The ${shown || "figure"} on the President's page may not be the agreed number.`;
      else if(r.child && r.parent && (findRow(d, r.parent) || {}).rollup){ const sh = shareOf(d, r); impact = sh ? `${sh.main} of the weighted pipeline (${shown}) hasn't been checked.` : `The ${shown} in the pipeline hasn't been checked.`; }
      else impact = `The ${shown || "figure"} shown may be out of date or unverified.`;
    }
    const owners = uniq(r.owners.map(x => x.role));
    next = topic === "Cost" ? `Ask ${owners.join(" and ")} to explain the gap and how much is price versus volume, by ${rb}.`
      : `Ask ${owners.join(" and ")} to confirm the figure${disagree || r.owners.length > 1 ? " and agree one owner" : ""} by ${rb}.`;
    out.push({ title: r.metric, category: topic, severity: sev, issue: cap(reasons.join("; ")) + ".", impact, next, rowIds:[r.id] });
  });
  d.operations.forEach(p => {
    ["reporting","staffing"].forEach(c => { const st = p.risk[c], t = p.tips[c] || {};
      if(!st || st === "green" || t.esc) return;
      out.push({ title:`${p.name}: ${c}`, category: cap(c), severity: st === "red" ? "high" : st === "amber" ? "medium" : "low",
        issue: `${t.text || cap(STATUS[st])} for ${p.name}.`, impact: `We can't tell whether ${p.name} has the ${c === "staffing" ? "people" : "reporting"} it needs before ${fmtLong(p.deadline)}.`,
        next: `Ask ${p.owner || "the project owner"} to report ${c} with a date by ${rb}.`, rowIds:[p.id] }); });
  });
  const c = costCalc(d), tgt = (+d.costModel.marginTarget || 0) / 100;
  if(c.five.margin != null && c.five.margin < tgt){
    out.push({ title:"NorthPoint deal margin below target", category:"Commercial", severity:"high",
      issue:`Under ${c.offer.name}, NorthPoint's 5-year gross margin is ${Math.round(c.five.margin * 100)}% against the ${Math.round(tgt * 100)}% target.`,
      impact:`Cost to serve averages ${unit$(c.five.total)} per account per month against ${unit$(c.five.rev)} of revenue; year 1 loses money because of the ${money(+d.costModel.implRate * +d.costModel.implMonths)} implementation.`,
      next:`Ask Head of Sales and Finance BP to agree which offer goes to the client before the review on ${fmtDow(S.ops.settings.reviewDate)}.`, rowIds:["cm-margin"] });
  }
  const known = knownFigures(d), texts = [d.header.title, ...d.escalations.flatMap(e => [e.issue, e.impact])];
  const bad = uniq(texts.flatMap(t => (String(t).match(/\$\d+(?:\.\d+)?M|\d+(?:\.\d+)?%/g) || []).filter(x => !known.has(x))));
  if(bad.length) out.unshift({ title:"Headline doesn't match the figures", category:"Data reporting", severity:"high", issue:`The title or cards mention ${bad.join(", ")}, which no figure in the tables supports.`, impact:"The President may act on numbers that have since changed.", next:"Update the headline and cards, or check the figures that changed.", rowIds:[] });
  const rank = { high:0, medium:1, low:2 };
  return out.sort((a, b) => rank[a.severity] - rank[b.severity]);
}

/* ---------- rendering helpers ---------- */
function cur(){ return S.view === "draft" ? S.draft : S.live; }
const editing = () => S.view === "draft";
const na = () => '<span class="na">—</span>';
function changedMap(d, row){
  if(!editing()) return {};
  const o = findRow(S.live, row.id), a = o ? cellData(S.live, o) : null, b = cellData(d, row), m = {};
  Object.keys(b).forEach(k => { m[k] = (!a || cellText(a[k]) !== cellText(b[k])) ? " chg" : ""; });
  return m;
}
function dotCell(key, label, c, chg){
  const escA = c.esc ? ` data-esc="${c.esc}" data-cotext="${h(c.tip)}"` : "";
  const dot = c.st ? `<span class="dot ${c.st}" ${editing() ? "" : 'tabindex="0"'} role="img" data-tip="${h(c.tip || cap(STATUS[c.st]))}" aria-label="${h(`${label}: ${STATUS[c.st]}. ${c.tip || ""}`.trim())}"></span>` : "";
  if(editing()) return `<td class="ctr${chg}"${escA}><button type="button" class="dotbtn" data-pop="${h(key)}" aria-label="Change ${label}">${dot || '<span class="plus">+</span>'}</button></td>`;
  return `<td class="ctr${chg}"${escA}>${dot}</td>`;
}
function numInput(key, v, extra = ""){ return `<input class="ci ${extra}" inputmode="decimal" data-set="${h(key)}" data-t="num" value="${h(blank(v) ? "" : v)}" aria-label="Edit value">`; }
function valCell(d, r, f, chg){
  const c = cellData(d, r)[f], bold = f !== "plan";
  if(editing() && !r.derive){
    if(f === "plan" && (!r.child || r.fmt !== "usd")) return `<td class="num${chg}">${numInput(`row:${r.id}:plan`, r.plan, "plain")}</td>`;
    if(f === r.field){
      const o = ownerOf(r);
      if(f === "forecast" && !blank(r.dealValue) && !blank(r.weight)) return `<td class="num${chg}"><span class="b">${h(c.t)}</span><span class="auto">deal × weight</span></td>`;
      if(o && "value" in o) return `<td class="num${chg}">${numInput(`row:${r.id}:@value`, o.value)}<span class="sub">${h(o.role)}</span></td>`;
      if(r.rollup && c.t) return `<td class="num${chg}"><span class="b">${h(c.t)}</span><span class="auto">sum of deals</span></td>`;
    }
  }
  return `<td class="num${chg}">${c.t ? `<span class="${bold ? "b" : ""}">${h(c.t)}</span>${r.derive && f !== "plan" ? '<span class="auto">implied</span>' : ""}` : na()}</td>`;
}
function varCell(c, chg){
  if(!c.main) return `<td class="num${chg}">${na()}</td>`;
  const escA = c.esc ? ` data-esc="${c.esc}" data-cotext="${h(c.tip)}"` : "";
  const inner = `<span class="b${c.adverse ? " neg" : ""}">${h(c.main)}</span><span class="sub">${h(c.sub)}</span>`;
  return `<td class="num${chg}"${escA}>${c.tip ? `<span class="vt" tabindex="0" data-tip="${h(c.tip)}">${inner}</span>` : inner}</td>`;
}
function ownerCell(r, c, chg){
  if(editing() && r.owners.length > 1){
    const opts = r.owners.map((o, i) => `<option value="${i}"${i === (r.owner || 0) ? " selected" : ""}>${h(o.role)}${"value" in o ? ` · ${blank(o.value) ? "no figure" : fmtV(r, o.value)}` : ""}</option>`).join("");
    return `<td class="${chg}"><select class="osel${c.warn ? " neg" : ""}" data-set="row:${h(r.id)}:@owner" data-t="int" aria-label="Data owner">${opts}</select><span class="sub">${h(c.sub)}</span></td>`;
  }
  return `<td class="${chg}"><span class="${c.warn ? "neg b" : ""}">${h(c.t)}</span>${c.sub ? `<span class="sub">${h(c.sub)}</span>` : ""}</td>`;
}
function updCell(key, iso, c, chg){
  if(editing()) return `<td class="${chg}"><input type="date" class="ci date" data-set="${h(key)}" data-t="date" value="${h(iso || "")}" aria-label="Last updated"></td>`;
  return `<td class="${chg}">${c.t ? `<span class="${c.stale ? "neg" : ""}">${h(c.t)}</span>` : na()}</td>`;
}

/* ---------- commercial + cloud tables ---------- */
function finTable(el, secs, kind){
  const d = cur(), showPipe = kind === "com" && S.tf !== "cq";
  const cols = kind === "com"
    ? ["metric","plan","actual","forecast","var", ...(showPipe ? ["deal","weight","share"] : []), "concentration","reporting","staffing","owner","updated"]
    : ["metric","plan","actual","forecast","var","annual","reporting","owner","updated"];
  const N = cols.length;
  const head = { metric:'<th class="sticky">Metric</th>', plan:'<th class="r">Plan</th>', actual:'<th class="r">Actual</th>', forecast:'<th class="r">Forecast</th>',
    var:'<th class="r g">Vs plan</th>', deal:'<th class="r g">Deal value</th>', weight:'<th class="r g">Weight</th>', share:'<th class="r g">Share of pipeline</th>',
    annual:'<th class="r g">A year at this rate</th>', concentration:'<th class="c g">Concentration</th>', reporting:'<th class="c g">Reporting</th>', staffing:'<th class="c g">Staffing</th>',
    owner:"<th>Data owner</th>", updated:"<th>Updated</th>" };
  const grp = [];
  cols.forEach(c => {
    const g = ["deal","weight","share"].includes(c) ? "PIPELINE WEIGHTING" : ["concentration","reporting","staffing"].includes(c) ? "RISK ASSESSMENT" : "";
    if(grp.length && grp[grp.length - 1].g === g) grp[grp.length - 1].n++; else grp.push({ g, n:1 });
  });
  let html = `<thead><tr class="grp dimmable">${grp.map(x => `<th colspan="${x.n}">${x.g ? `<span>${x.g}</span>` : ""}</th>`).join("")}</tr><tr class="cols dimmable">${cols.map(c => head[c]).join("")}</tr></thead><tbody>`;
  secs.forEach(sec => {
    const collapsed = !!S.collapsed[sec.id];
    let rows = sec.rows;
    if(sec.timeframe && S.tf !== "all") rows = rows.filter(r => r.period === S.tf);
    let summary = "";
    if(collapsed && rows.length) summary = `<span class="csum">${rows.filter(r => !r.child).map(r => { const c = cellData(d, r), v = c.var; return `${h(r.metric)}: <b>${h(c[r.field].t || "—")}</b>${v.main ? ` <span class="${v.adverse ? "neg" : ""}">${h(v.main)}</span>` : ""} ${r.risk.reporting ? `<i class="dot ${r.risk.reporting}"></i>` : ""}`; }).join(" · ")}</span>`;
    const tfSel = sec.timeframe ? `<label class="csum">Period <select class="tf" data-act="tf" aria-label="Booking period">${Object.entries(TF).map(([k, l]) => `<option value="${k}"${S.tf === k ? " selected" : ""}>${h(l)}</option>`).join("")}</select></label>` : "";
    html += `<tr class="sh dimmable"><th colspan="${N}"><div class="shi"><button class="tog" data-act="sec" data-sec="${h(sec.id)}" aria-expanded="${!collapsed}"><span class="cv">▾</span>${h(sec.name)}</button>${summary}${tfSel}</div></th></tr>`;
    if(collapsed) return;
    rows.forEach(r => {
      const c = cellData(d, r), ch = changedMap(d, r), C = k => ch[k] || "";
      let tr = `<tr data-row="${h(r.id)}" class="dimmable${r.child ? " child" : ""}">`;
      cols.forEach(k => {
        if(k === "metric") tr += `<td class="sticky${C("metric")}"><span class="m" ${editing() ? `contenteditable="true" data-edit="row:${h(r.id)}:metric"` : ""}>${h(r.metric)}</span></td>`;
        else if(k === "plan" || k === "actual" || k === "forecast") tr += valCell(d, r, k, C(k));
        else if(k === "var") tr += varCell(c.var, C("var"));
        else if(k === "deal") tr += editing() && r.child ? `<td class="num${C("deal")}">${numInput(`row:${r.id}:dealValue`, r.dealValue, "plain")}</td>` : `<td class="num${C("deal")}">${c.deal.t ? h(c.deal.t) : na()}</td>`;
        else if(k === "weight") tr += editing() && r.child ? `<td class="num${C("weight")}">${numInput(`row:${r.id}:weight`, r.weight, "plain w")}%</td>` : `<td class="num${C("weight")}">${c.weight.t ? h(c.weight.t) + (r.rollup ? '<span class="sub">blended</span>' : "") : na()}</td>`;
        else if(k === "share") tr += `<td class="num${C("share")}">${c.share.t ? `<span class="b">${h(c.share.t)}</span><span class="sub">${h(c.share.sub)}</span>` : na()}</td>`;
        else if(k === "annual") tr += `<td class="num${C("annual")}">${c.annual.t ? `<span class="b${c.annual.adverse ? " neg" : ""}">${h(c.annual.t)}</span><span class="sub">vs plan</span>` : na()}</td>`;
        else if(COLS.some(x => x[0] === k)) tr += dotCell(`row:${r.id}:${k}`, COLS.find(x => x[0] === k)[1], c[k], C(k));

/* ---------- operations ---------- */
function axis(d){
  let a = null, b = null;
  d.operations.forEach(p => { p.stages.forEach(s => { if(s.start && (!a || s.start < a)) a = s.start; const e = s.end || s.start; if(e && (!b || e > b)) b = e; }); if(p.deadline && (!b || p.deadline > b)) b = p.deadline; });
  const t = todayISO(); if(!a) a = t; if(t < a) a = t; if(!b || t > b) b = t;
  const A = pd(a), B = pd(b);
  const start = `${A.y}-${String(A.m).padStart(2,"0")}-01`;
  const em = B.m === 12 ? { y:B.y + 1, m:1 } : { y:B.y, m:B.m + 1 };
  const end = `${em.y}-${String(em.m).padStart(2,"0")}-01`;
  const total = days(start, end), months = [];

function projStatus(p){

  if(kind === "proj") return { obj: findProj(S.draft, parts[1]), path: parts.slice(2).join(":") };

}

/* ---------- follow-up popup ---------- */
function factsFor(d, ids){
  const out = [];
  ids.forEach(id => {
    const r = findRow(d, id);
    if(r){ const parts = ["plan","actual","forecast"].map(f => { const v = val(d, r, f); return blank(v) ? null : `${f} ${fmtV(r, v)}`; }).filter(Boolean), v = variance(d, r);
      out.push(`${r.metric}: ${parts.join(", ")}${v ? `, ${v.main} vs plan` : ""}`); return; }
    const p = findProj(d, id);
    if(p){ const cd = countdown(p), bl = p.stages.filter(s => s.blocker).map(s => s.blocker);
      out.push(`${p.name}: deadline ${fmtLong(p.deadline)}${cd ? ` (${cd.t})` : ""}${p.kpi ? `, ${p.kpi.label.toLowerCase()} ${p.kpi.actual} of ${p.kpi.plan}` : ""}${bl.length ? `; blockers: ${bl.join("; ")}` : ""}${p.owner ? "" : "; no owner"}`); }
  });
  return out;
}
function refContext(ref){
  const d = cur();
  if(ref.startsWith("esc")){
    const e = d.escalations.find(x => "esc" + x.id === ref); if(!e) return null;
    return { ref, label:`Escalation ${e.id}: ${titleCase(e.title)}`, issue:e.issue, impact:e.impact, next:e.next, facts: factsFor(d, linkedRows(e.id)) };
  }
  if(ref.startsWith("iss")){
    const it = currentIssues().items[+ref.slice(3)]; if(!it) return null;
    return { ref:"iss:" + it.title, label: it.title, issue: it.issue || it.detail || "", impact: it.impact || "", next: it.next || "", facts: factsFor(d, new Set(it.rowIds || [])) };
  }
  if(ref.startsWith("proj:") || ref.startsWith("blk:")){
    const [, pid, si] = ref.split(":"), p = findProj(d, pid); if(!p) return null;
    const s = si != null ? p.stages[+si] : null, cd = countdown(p);
    const notes = ["reporting","staffing"].filter(c => p.risk[c] && p.risk[c] !== "green").map(c => `${cap(c)}: ${(p.tips[c] || {}).text || STATUS[p.risk[c]]}`);
    return { ref, label: s ? `${p.name}: ${s.name}` : p.name,
      issue: s ? `${s.tag ? s.tag + " blocker: " : ""}${s.blocker} (${s.name}, due ${fmtLong(s.end || s.start)}).` : `${p.name} is ${projStatus(p).label.toLowerCase()}${notes.length ? ". " + notes.join(". ") : ""}.`,
      impact: p.deadline ? `The ${fmtLong(p.deadline)} deadline${cd ? ` (${cd.t})` : ""} is at risk.` : "",
      next: s ? `Clear the blocker or give a new date for ${s.name}.` : "Send an updated plan with an owner and a date for each step.", facts: factsFor(d, [p.id]) };
  }
  return null;
}
function templateDraft(ctx, keys){

  const body = `Hi ${greet},\n\nAhead of the leadership review on ${fmtDow(st.reviewDate)}, the President's dashboard flags this:\n\n${ctx.issue}${ctx.impact ? `\n\nWhy it matters: ${ctx.impact}` : ""}${ctx.facts.length ? `\n\nWhere the numbers stand:\n${ctx.facts.map(f => "- " + f).join("\n")}` : ""}\n\n${ctx.next ? `What we need: ${ctx.next.replace(/\.$/, "")}.` : "Could you confirm the correct figures and who owns them?"} Please reply by ${fmtDow(st.replyBy)}.\n\nThanks,\n${st.senderName}`;

}

/* ---------- clicks ---------- */
document.addEventListener("click", async e => {
  const pb = e.target.closest("[data-pop]");
  if(!$("#pop").hidden && !e.target.closest("#pop") && !pb) closePop();
  if(pb){ const key = pb.dataset.pop; if(S.pop === key){ closePop(); return; } if(S.pop){ $("#pop").hidden = true; S.pop = null; } openPop(key, pb); return; }
  const ps = e.target.closest("[data-popst]"); if(ps){ const { r, col } = popTarget(); r.risk[col] = ps.dataset.popst || null; dirty(false); document.querySelectorAll("#pop [data-popst]").forEach(b => b.setAttribute("aria-pressed", b === ps)); return; }
  if(S.vmenu && !e.target.closest("#vmenu") && !e.target.closest('[data-act="versions"]')){ S.vmenu = false; S.restoreAsk = null; renderVMenu(); }
  if(e.target.id === "modal"){ closeModal(); return; }
  if(S.modal && S.modal.toOpen && !e.target.closest(".dd")){ S.modal.toOpen = false; renderModal(); }
  const a = e.target.closest("[data-act]");
  if(!a){
    if(e.target.isContentEditable || e.target.closest("input,select,textarea,a")) return;
    const card = e.target.closest(".card[data-card]"); if(card){ const k = "esc" + card.dataset.card; if(S.focus === k) clearFocus(); else setFocus("esc", +card.dataset.card, true); return; }
    const li = e.target.closest("li[data-issue]"); if(li){ const k = "iss" + li.dataset.issue; if(S.focus === k) clearFocus(); else setFocus("iss", +li.dataset.issue, true); return; }
    if(S.focus && !e.target.closest("#focusbar")) clearFocus();
    return;
  }
  const m = S.modal;
  switch(a.dataset.act){
    case "view": S.view = a.dataset.v; S.pubConfirm = S.discardConfirm = false; S.focus = null; renderBar(); renderDashboard(); if(S.view === "draft") maybeAI("draft"); break;
    case "versions": S.vmenu = !S.vmenu; S.restoreAsk = null; renderBar(); if(!S.vmenu) renderVMenu(); break;
    case "restore": S.restoreAsk = +a.dataset.v; renderVMenu(); break;
    case "restore-no": S.restoreAsk = null; renderVMenu(); break;
    case "restore-go": await restoreVersion(+a.dataset.v); break;
    case "unfocus": clearFocus(); break;
    case "sec": { const k = a.dataset.sec; S.collapsed[k] = !S.collapsed[k]; savePrefs(); renderDashboard(); break; }
    case "issues": S.issuesOpen = !S.issuesOpen; savePrefs(); if(S.focus && S.focus.startsWith("iss")) clearFocus(); renderIssues(); break;
    case "ai-refresh": maybeAI(S.view === "draft" ? "draft" : "live", true); break;
    case "follow": openModal(a.dataset.ref); break;
    case "pub": S.pubConfirm = true; renderDraftbar(); break;
    case "discard": S.discardConfirm = true; renderDraftbar(); break;
    case "cancel": S.pubConfirm = S.discardConfirm = false; renderDraftbar(); break;
    case "pub-go": await publish(); break;
    case "discard-go": S.draft = clone(S.live); S.discardConfirm = false; renderAll(); saveDraft(); toast("Draft reset to what the President sees."); break;
    case "mclose": closeModal(); break;
    case "mto": m.toOpen = !m.toOpen; renderModal(); break;
    case "mcontacts": m.contacts = !m.contacts; renderModal(); break;

/* ---------- persistence, versions, AI ---------- */
let saveT = null, opsT = null, aiT = null;
function setSaved(t){ const e = $("#saveSt"); if(e) e.textContent = t; }
function dirty(rerender){ if(rerender){ renderDashboard(); renderBar(); } else { const b = $("#chgN"); if(b) b.textContent = diffCount(); } saveDraft(); }
function saveLocal(){ try{ localStorage.setItem(LSKEY, JSON.stringify({ live:S.live, draft:S.draft, ops:S.ops, history:S.history })); }catch(e){} }
function saveDraft(){
  setSaved("Saving…"); clearTimeout(saveT);
  saveT = setTimeout(async () => {
    if(S.mode === "server"){ try{ await api("draft", { method:"PUT", body: JSON.stringify({ draft:S.draft }) }); setSaved("Saved"); if(S.issues.draft) S.issues.draft.stale = true; scheduleAI(); }catch(e){ setSaved("Not saved: " + e.message); } }
    else { saveLocal(); setSaved("Saved in this browser"); renderIssues(); }
  }, 600);
}
function saveOps(){ clearTimeout(opsT); opsT = setTimeout(async () => { if(S.mode === "server"){ try{ await api("ops", { method:"PUT", body: JSON.stringify({ ops:S.ops }) }); }catch(e){ toast("Contacts not saved: " + e.message); } } else saveLocal(); }, 400); }
function scheduleAI(){ if(!S.ai.enabled){ renderIssues(); return; } clearTimeout(aiT); aiT = setTimeout(() => maybeAI("draft"), 5000); }
async function maybeAI(which, force){
  if(S.mode !== "server" || !S.ai.enabled){ renderIssues(); return; }
  const c = S.issues[which]; if(!force && c && !c.stale && c.items) return;
  S.aiBusy = true; renderIssues();
  try{ const res = await api("ai/issues", { method:"POST", body: JSON.stringify({ which, force: !!force }) }); S.issues[which] = res; }
  catch(e){ if(force) toast("AI couldn't refresh the issues: " + e.message); }
  S.aiBusy = false; renderIssues();
}
function histEntry(live, note){ return { version: live.version, at: live.publishedAt, by: live.publishedBy, note: note || "", snapshot: clone(live) }; }
async function publish(){
  if(S.mode === "server"){
    try{ const res = await api("publish", { method:"POST", body: JSON.stringify({ draft:S.draft }) }); S.live = normalize(res.live); S.draft = normalize(res.live); if(res.issues) S.issues.live = res.issues; if(res.history) S.history = res.history; }
    catch(e){ toast("Not published: " + e.message); return; }
  } else {
    const live = Object.assign(clone(S.draft), { version:(S.live.version || 1) + 1, publishedAt: new Date().toISOString(), publishedBy:"You (preview)" });
    if(!S.history.some(x => x.version === S.live.version)) S.history.unshift(histEntry(S.live));
    S.history.unshift(histEntry(live)); S.live = normalize(live); S.draft = normalize(live); saveLocal();
  }
  S.pubConfirm = false; S.view = "live"; renderAll();
  toast(`Published v${S.live.version}. The President now sees these figures.`);
}
async function restoreVersion(v){
  if(S.mode === "server"){
    try{ const res = await api("restore", { method:"POST", body: JSON.stringify({ version: v }) }); S.live = normalize(res.live); S.draft = normalize(res.live); S.history = res.history || S.history; }
    catch(e){ toast("Not restored: " + e.message); return; }
  } else {
    const h0 = S.history.find(x => x.version === v); if(!h0 || !h0.snapshot){ toast("That version isn't stored in this preview."); return; }
    if(!S.history.some(x => x.version === S.live.version)) S.history.unshift(histEntry(S.live));
    const live = Object.assign(clone(h0.snapshot), { version: S.live.version + 1, publishedAt: new Date().toISOString(), publishedBy: "You (preview)" });
    S.history.unshift(histEntry(live, `Restored from v${v}`)); S.live = normalize(live); S.draft = normalize(live); saveLocal();
  }
  S.vmenu = false; S.restoreAsk = null; S.view = "live"; renderAll();
  toast(`v${v} is live again as v${S.live.version}.`);
}
async function api(path, opts = {}){
  const r = await fetch("/api/" + path, Object.assign({ headers:{ "content-type":"application/json" }, credentials:"same-origin" }, opts));
  let j = null; try{ j = await r.json(); }catch(e){ throw new Error("No dashboard server here"); }
  if(!r.ok) throw new Error((j && j.error) || r.statusText);
  return j;
}
let toastT = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }

/* ---------- boot ---------- */
function mergeOps(o){
  const d = clone(OPS_DEFAULT); if(!o) return d;
  return { dirV: 2, directory: o.dirV === 2 && o.directory ? o.directory : d.directory, settings: Object.assign(d.settings, o.settings || {}, o.dirV === 2 ? {} : { cc: "" }), outbox: o.outbox || [] };
}
function valid(x){ return !!(x && x.commercial && x.operations); }
async function boot(){
  loadPrefs();
  S.live = normalize(DATA); S.draft = normalize(DATA); S.ops = clone(OPS_DEFAULT); S.history = [histEntry(S.live, "Q3 tracker extract")];
  try{ const j = JSON.parse(localStorage.getItem(LSKEY) || "null"); if(j && valid(j.live)){ S.live = normalize(j.live); S.draft = normalize(valid(j.draft) ? j.draft : j.live); S.ops = mergeOps(j.ops); S.history = j.history || S.history; } }catch(e){}
  renderAll();
  try{
    const st = await Promise.race([api("state"), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 6000))]);
    S.mode = "server"; S.me = st.me || S.me; S.mail = st.mail || S.mail; S.ai = st.ai || S.ai;
    if((!valid(st.live) || (st.live.schema || 0) < DATA.schema) && S.me.admin) Object.assign(st, await api("init", { method:"POST", body: JSON.stringify({ live: normalize(DATA), draft: normalize(DATA), ops: mergeOps(st.ops) }) }));
    if(!valid(st.live)) throw new Error("No published data yet.");
    S.live = normalize(st.live); S.draft = normalize(valid(st.draft) ? st.draft : st.live); S.ops = mergeOps(st.ops); S.issues = st.issues || S.issues; S.history = st.history || [];
    if(st.ops && st.ops.dirV !== 2 && S.me.admin) saveOps();
    renderAll();
    maybeAI("live");
  }catch(e){ if(S.mode !== "server"){ S.mode = "demo"; S.me = { admin:true, email:"", setup:false }; } renderBar(); }
}
boot();
