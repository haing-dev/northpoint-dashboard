<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Platform BU Leadership Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: slide-style page. Header → escalations → other issues → Commercial → Cost → Operations. */
:root{
  /* Type scale. Design rule: every font size on the page uses one of these tokens (checked by tools/check-design.mjs).
     Controls (buttons, toggles, chips) are built from .btn/.btn.sm/.btn.xs so they always match each other. */
  --fs-2xs:9px; --fs-xs:10px; --fs-sm:11px; --fs-md:12px; --fs-base:13px; --fs-body:14px; --fs-lg:15px; --fs-h:18px; --fs-xl:24px; --fs-2xl:30px;

  --ink:#000000; --deep:#051C2C; --grey-text:#595959; --na:#A6A6A6; --card-bg:#F2F2F2;
  --rule:#D9D9D9; --rule-strong:#7F7F7F; --neg:#C00000;
  --dot-green:#2E9B4F; --dot-amber:#F2A900; --dot-red:#D7342A; --dot-nodata:#8C8C8C;
  --bg:#FFFFFF; --soft:#F6F7F8; --chg:#FFF3C4; --focus:#1F5FBF; --lit:#EAF1F7;
  --ok-bg:#E5F3E9; --ok-fg:#1D6232; --warn-bg:#FCF0D2; --warn-fg:#6E4E00; --bad-bg:#FBE3E1; --bad-fg:#9A1F17; --off-bg:#ECEDEE; --off-fg:#595959; --act-bg:#E3EAF0; --act-fg:#051C2C;
  --serif:Georgia,"Times New Roman",serif; --sans:Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);font-size:var(--fs-body);line-height:1.4;color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- bar ---------- */
.bar,.page{max-width:1280px;margin-left:auto;margin-right:auto;padding-left:8px;padding-right:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;border-bottom:1px solid var(--rule);font-size:var(--fs-md);color:var(--grey-text)}
.brand{font-weight:700;color:var(--ink);letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:10px;background:var(--soft);white-space:nowrap;border:0;font:inherit;color:inherit}
button.chip{cursor:pointer}
button.chip:hover{background:#ECEEF0}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}
.chip .dot{width:8px;height:8px;cursor:default}
.sp{flex:1}
.segv{display:inline-flex;border:1px solid var(--rule-strong);border-radius:2px;overflow:hidden}
.segv button{border:0;background:#fff;color:var(--grey-text);font:700 var(--fs-sm) var(--sans);padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.segv button[aria-pressed="true"]{background:var(--deep);color:#fff}
.btn{font:700 var(--fs-md)/1 var(--sans);padding:8px 12px;border:1px solid var(--deep);background:#fff;color:var(--deep);border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--deep);color:#fff}
.btn.primary:hover{background:#0B2F48}
.btn.sm{padding:6px 10px;font-size:var(--fs-sm)}
.btn.xs{padding:4px 8px;font-size:var(--fs-xs)}
.btn.ghost{border-color:transparent;text-decoration:underline;padding-inline:6px;background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lnk{color:var(--deep);font-weight:700;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font-size:var(--fs-md)}
#vmenu{position:fixed;z-index:86;background:#fff;border:1px solid var(--rule-strong);box-shadow:0 8px 24px rgba(5,28,44,.18);width:300px;font-size:var(--fs-md);max-height:60vh;overflow:auto}
#vmenu .vh{padding:8px 12px;font:700 var(--fs-sm) var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--grey-text);border-bottom:1px solid var(--rule)}
#vmenu .vi{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule)}
#vmenu .vi:last-child{border-bottom:0}
#vmenu .vi b{min-width:26px}
#vmenu .vi .muted{flex:1}
#vmenu .vc{padding:8px 12px;background:var(--soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- page ---------- */
.page{padding-block:20px 40px}
.draftbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--chg);border:1px solid #EAD48A;padding:8px 12px;font-size:var(--fs-md);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.draftbar .save{color:var(--grey-text)}
.draftbar ul{flex-basis:100%;margin:4px 0 0;padding-left:18px;max-height:140px;overflow:auto}
.kicker{font-size:var(--fs-md);letter-spacing:.08em;color:var(--grey-text);text-transform:uppercase}
h1{font:700 var(--fs-2xl)/1.2 var(--serif);margin:6px 0 0;max-width:1040px;text-wrap:balance}
.lbl{font:700 var(--fs-sm) var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--grey-text);margin:24px 0 8px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:#FBEAEA;padding:16px;display:grid;grid-row:span 5;grid-template-rows:subgrid;row-gap:0;align-content:start;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease;position:relative}
.card:hover,.card:focus-visible{transform:translateY(-5px) scale(1.015);box-shadow:0 14px 30px rgba(5,28,44,.20),0 0 0 1px rgba(5,28,44,.25);background:#F8E1E1;z-index:2}
.card.lit{outline:2px solid var(--deep)}
.ct{display:flex;align-items:center;gap:10px;font:700 var(--fs-lg)/1.25 var(--sans);text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px}
.cb{flex:none;width:24px;height:24px;border-radius:50%;background:var(--deep);color:#fff;font:700 var(--fs-base)/var(--fs-xl) var(--sans);text-align:center}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;margin-top:10px;font-size:var(--fs-body)}
.kv>span:first-child{font:700 var(--fs-sm)/1.7 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--grey-text)}
.kv .b{font-weight:700}
.cf{padding-top:14px;align-self:start;cursor:default}
#hlwrap{margin:18px 0 4px}
.fhw{margin-top:14px}
.fht{font:700 var(--fs-sm) var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--grey-text);margin-bottom:6px}
.fhl{display:flex;flex-direction:column;gap:0;max-height:260px;overflow:auto;border:1px solid var(--rule);border-radius:2px}
.fhi{padding:10px 12px;border-bottom:1px solid var(--rule);font-size:var(--fs-md)}.fhi:last-child{border-bottom:0}
.fhm{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fhd{color:var(--grey-text);min-width:44px}
.fhi summary{cursor:pointer;margin:4px 0 0 50px;color:var(--deep)}
.fhi details pre{margin-left:50px}
.fhr{margin:8px 0 0 50px;padding:8px 10px;background:var(--act-bg);border-radius:2px}.fhr .fhd{margin-right:6px}.fhr p{margin:4px 0 0}
.fhb{white-space:pre-wrap;font:var(--fs-md)/1.45 var(--sans);background:#FAFAFA;border:1px solid var(--rule);padding:8px;margin:0 0 6px;max-height:220px;overflow:auto}
.dpk{position:relative;display:inline-block;min-width:56px;border-bottom:1px dashed #B9A85A;cursor:pointer}
.dpk .dpv{pointer-events:none}
.dpk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.subs{margin:40px 0 6px}
.subh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.subh .tog{font:700 var(--fs-sm) var(--sans);letter-spacing:.08em;text-transform:uppercase}
.warnt{color:var(--warn-fg);font-weight:700}
.subt td{padding-top:7px;padding-bottom:7px}
.aiw{display:block}.aix{display:block;margin-top:2px;font-size:var(--fs-xs);font-weight:400}
.aist{font-size:var(--fs-md);color:var(--grey-text)}
.ce1{padding:6px 10px}
.hlc{background:var(--ok-bg);border-left:4px solid var(--dot-green, #2E8540);padding:16px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.hlc:hover,.hlc:focus-visible{transform:translateY(-3px);box-shadow:0 14px 30px rgba(5,28,44,.16),0 0 0 1px rgba(29,98,50,.35)}
.hlc.lit{outline:2px solid var(--ok-fg)}
.tr td.ndc{text-align:left}.tr td.ndc-owner{padding-left:41px}.tr td.ndc-source{padding-left:43px}.tr td.ndc-updated{padding-left:30px}
.hlc .ct{margin-bottom:2px}
.cb.ok{background:var(--ok-fg)}
.hlg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.hlg .kv{grid-template-columns:minmax(0,1fr);gap:2px}
.ttl{color:var(--grey-text);font-weight:400}
.osel2{display:block;margin-top:6px;width:100%;max-width:100%;font-size:var(--fs-sm)}
.tog.rt{padding:0 4px 0 0;margin-left:-2px}
tr.ph td.sticky .m{color:var(--grey-text)}
.cfr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fus{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-sm)}
.fus.bad{color:var(--neg);font-weight:700}.fus.ok{color:var(--ok-fg)}
.fut{gap:8px}.fua{font-size:var(--fs-2xs)}
.pnm{display:inline-flex;align-items:center;gap:8px}
.cbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:14px;align-self:end;cursor:default}
.cbar .cf{padding-top:0}
.nb{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.ntx{margin:4px 0 0 50px;white-space:pre-wrap}
.il li .cbar{padding-top:10px}
.rl li{cursor:default}
.cfs{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:8px}
.fuh{list-style:none;margin:8px 0 0;padding:0 12px;background:#fff;border:1px solid var(--rule)}.fuh li:last-child{border-bottom:0}
.fuh li{padding:8px 0;border-bottom:1px solid var(--rule);font-size:var(--fs-md)}
.fuh2{color:var(--grey-text);margin-top:2px}
.fuh3{display:flex;align-items:center;gap:10px;margin-top:4px}
.fuh3 .btn,.fuh3 .lnk{margin-left:auto}
.rec{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
.dtick{margin:0 5px 0 0;vertical-align:middle;accent-color:var(--deep);cursor:pointer}
.dtick.wif{outline:2px solid #B9A85A;outline-offset:1px}
tr.off td:not(.sticky){opacity:.4}
tr.off td.sticky .m{text-decoration:line-through;color:var(--grey-text)}
.muted{color:var(--grey-text);font-size:var(--fs-sm)}
.hint{color:var(--grey-text);font-size:var(--fs-sm);margin-left:auto}
[contenteditable="true"]{outline:1px dashed #B9A85A;outline-offset:2px;border-radius:1px;cursor:text}
[contenteditable="true"]:focus{outline:2px solid var(--focus);background:#fff}

/* other issues */
.issues{margin-top:16px;border:1px solid var(--rule)}
.ih{width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:0;padding:10px 14px;cursor:pointer;text-align:left;font-size:var(--fs-base)}
.ih b{font:700 var(--fs-md) var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.ih .cnt{background:var(--deep);color:#fff;border-radius:9px;padding:1px 7px;font:700 var(--fs-sm) var(--sans)}
.ih .src{color:var(--grey-text);font-size:var(--fs-md)}
.ih .chev{margin-left:auto;color:var(--grey-text)}
.il{list-style:none;margin:0;padding:0 14px;border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.il li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px 10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.il li.lit{background:var(--lit)}
.il .dot{margin-top:4px;cursor:default}
.il .t{font-weight:700;font-size:var(--fs-base)}
.il .kv{grid-template-columns:78px minmax(0,1fr);margin-top:6px;font-size:var(--fs-base);gap:8px}
.il .kv>span:first-child{font-size:var(--fs-xs)}
.il .act{grid-column:2;margin-top:8px}
#resolved{margin-top:12px}
.tag{display:inline-block;font:700 var(--fs-2xs)/1.4 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--grey-text);border:1px solid var(--rule-strong);padding:0 4px;border-radius:2px;margin-right:6px;vertical-align:1px;white-space:nowrap}
.ifoot{padding:8px 14px;border-top:1px solid var(--rule);font-size:var(--fs-sm);color:var(--grey-text);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:var(--fs-md);color:var(--grey-text);margin:28px 0 0;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{cursor:default}
.tt{display:flex;align-items:baseline;gap:12px;margin:30px 0 6px;flex-wrap:wrap;scroll-margin-top:70px}
.tt .n{font:400 var(--fs-2xl)/1 var(--serif)}
.tt h2{font:700 var(--fs-lg) var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:0}
.tt h3{font:700 var(--fs-base) var(--sans);margin:0}
.tt .note{font-size:var(--fs-md);color:var(--grey-text)}
.tt.sub{margin-top:22px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tr{border-collapse:collapse;width:100%;font-size:var(--fs-base);font-variant-numeric:tabular-nums}
.tr th{font:400 var(--fs-sm) var(--sans);text-transform:uppercase;letter-spacing:.03em;color:var(--grey-text);text-align:left;padding:4px 8px;vertical-align:bottom;background:#fff;white-space:nowrap}
.tr th.r{text-align:center}.tr th.c{text-align:center}
.tr th.g{}
.tr tr.grp th{padding-bottom:0}
.tr tr.grp th span{display:block;border-bottom:1px solid var(--rule-strong);padding-bottom:3px;text-align:center}
.tr tr.cols th{border-bottom:2px solid var(--deep);padding-bottom:6px}
.tr td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:middle;position:relative;background:#fff}
.tr tr{scroll-margin-top:90px}
.tr td.num{text-align:center;white-space:nowrap}
.okc{color:var(--ok-fg);font-weight:700}
.tr td.num .ci{text-align:center}
.tr td.ctr{text-align:center;white-space:nowrap}
.tr .sticky{position:sticky;left:0;z-index:1}
.tr td.sticky{min-width:220px}
body.edit .tr td.sticky{min-width:250px}
.tr th.sticky{z-index:2}
.tr tr.sh th{background:#fff;padding:12px 8px 6px;border-bottom:1.5px solid var(--rule-strong);text-transform:none;letter-spacing:0;color:var(--ink);font-size:var(--fs-base);vertical-align:middle}
.tr tr.sub2 td{font-size:var(--fs-sm);color:var(--grey-text);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding-top:10px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.tr tr.tot td{border-top:1.5px solid var(--rule-strong);font-weight:700}
.shi{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tog{border:0;background:none;padding:0;font:700 var(--fs-base) var(--sans);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-align:left}
.tog .cv{display:inline-block;width:14px;color:var(--grey-text);transition:transform .15s}
.tog[aria-expanded="false"] .cv{transform:rotate(-90deg)}
.csum{font-weight:400;color:var(--grey-text);font-size:var(--fs-md);display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.tf{font:var(--fs-md) var(--sans);padding:4px 8px;border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink)}
.m{font-weight:700}
tr.child .m{font-weight:400;padding-left:20px;display:inline-block}
.sub{display:block;font-size:var(--fs-sm);color:var(--grey-text);font-weight:400}
.na{color:var(--na)}
.b{font-weight:700}
.neg{color:var(--neg)}
.drv{font-size:var(--fs-md);color:var(--grey-text);white-space:normal;min-width:240px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;cursor:help}
.dot.green{background:var(--dot-green)}.dot.amber{background:var(--dot-amber)}.dot.red{background:var(--dot-red)}
.dot.nodata{background:transparent;border:1.5px dotted var(--dot-nodata)}
.dot:focus-visible,.vt:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:50%}
.vt{cursor:help;display:inline-block}
.dotbtn{border:1px dashed #C8B66A;background:none;padding:4px 6px;border-radius:2px;cursor:pointer;line-height:0}
.dotbtn .plus{display:inline-block;width:10px;height:10px;line-height:10px;font-size:var(--fs-md);color:#B7A24E}
td.chg{background:var(--chg)!important}
.ci{width:76px;text-align:right;border:0;border-bottom:1px dashed #B9A85A;background:transparent;font:inherit;font-weight:700;padding:2px 0;color:var(--ink)}
.ci.plain{font-weight:400}
.ci.date{width:122px;text-align:left;font-weight:400}
.ci.w{width:44px}
.ci.s{width:54px;font-weight:400}
.ci:focus{outline:2px solid var(--focus);background:#fff}
.osel{font:inherit;font-size:var(--fs-base);border:0;border-bottom:1px dashed #B9A85A;background:transparent;padding:2px 0;max-width:210px;color:inherit}
.auto{font-size:var(--fs-xs);color:var(--grey-text);text-transform:uppercase;letter-spacing:.04em;display:block}
.pend{font-size:var(--fs-md);color:var(--grey-text);padding:8px 0}
.foot{font-size:var(--fs-sm);color:var(--grey-text);margin:8px 0 0}

/* focus mode */
.dimmable{transition:opacity .15s}
body.focusing .dimmable:not(.lit){opacity:.32}
body.focusing tr.lit td{background:var(--lit)}
body.focusing tr.lit td:first-child{box-shadow:inset 3px 0 0 var(--deep)}
#callouts{position:fixed;inset:0;pointer-events:none;z-index:60}
.co{position:fixed;background:var(--deep);color:#fff;font:700 var(--fs-md)/1.3 var(--sans);padding:5px 9px 5px 5px;border-radius:2px;display:flex;align-items:center;gap:7px;max-width:230px;box-shadow:0 3px 10px rgba(5,28,44,.25);animation:pop .14s ease-out}
.co::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--deep)}
.co.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--deep)}
.co.stack::after{display:none}
#tip.multi{background:none;padding:0;display:flex;flex-direction:column;gap:6px}
#tip.multi .tb{background:var(--deep);padding:6px 8px;border-radius:2px}
.xr{display:inline-flex;gap:10px;align-items:center;justify-content:center;vertical-align:middle}
.xr>.dot,.rk .dot{box-sizing:border-box}
.xr .xri{align-self:flex-start}
.fr-top{align-items:start}.fr-top>span{padding-top:4px}
.rkl{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto;border:1px solid var(--rule);padding:6px 8px;border-radius:2px}
.rk{display:flex;align-items:center;gap:7px;font-size:var(--fs-md);cursor:pointer}.rk .dot{flex:none}.xri{display:inline-flex;flex-direction:column;align-items:center;gap:2px}.xri small{font-size:var(--fs-2xs);color:var(--grey-text)}
.co .cn{flex:none;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--deep);font:700 var(--fs-sm)/20px var(--sans);text-align:center}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.96)}to{opacity:1;transform:none}}
.focusbar{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:#fff;border:1px solid var(--deep);box-shadow:0 6px 18px rgba(0,0,0,.15);padding:6px 8px 6px 12px;font-size:var(--fs-md);display:flex;gap:10px;align-items:center}

/* operations */
tr.proj td{border-top:1.5px solid var(--rule-strong);padding-top:10px;padding-bottom:10px}
tr.stage td{font-size:var(--fs-md);padding-top:5px;padding-bottom:5px;border-bottom-color:#ECECEC}
tr.stage .sn{padding-left:22px;display:block}
.sc{display:inline-block;font:700 var(--fs-xs)/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;padding:4px 7px;border-radius:10px;white-space:nowrap}
.sc.done{background:var(--ok-bg);color:var(--ok-fg)}.sc.active{background:var(--act-bg);color:var(--act-fg)}.sc.planned{background:#fff;color:var(--grey-text);border:1px solid var(--rule)}
.sc.blocked{background:var(--bad-bg);color:var(--bad-fg)}.sc.noupdate{background:var(--off-bg);color:var(--off-fg)}.sc.late{background:var(--warn-bg);color:var(--warn-fg)}

  if(typeof s !== "string" || !/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/.test(s)) return s;

function days(a, b){ const A = pd(a), B = pd(b); return Math.round((Date.UTC(B.y,B.m-1,B.d) - Date.UTC(A.y,A.m-1,A.d)) / 864e5); }
function todayISO(){ const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; }
function ago(iso){ if(!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 6e4); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : fmtLong(iso); }
function money(v){ if(blank(v)) return null; v = +v; if(Math.abs(v) < 0.05) return "$0"; return (v < 0 ? MINUS : "") + "$" + r1(Math.abs(v)) + "M"; }
function smoney(v){ if(Math.abs(v) < 0.05) return "$0"; return (v > 0 ? "+" : MINUS) + "$" + r1(Math.abs(v)) + "M"; }
function unit$(v){ return blank(v) ? null : (v < 0 ? MINUS : "") + "$" + Math.abs(+v).toFixed(3); }

function setP(o, p, v){ const ks = p.split("."); let a = o; for(let i = 0; i < ks.length - 1; i++){ if(a[ks[i]] == null || typeof a[ks[i]] !== "object") a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length-1]] = v; }

/* ---------- data model ---------- */
function normRow(r){
  const o = Object.assign({ child:false, parent:null, period:null, field:"actual", better:"higher", fmt:"usd", plan:null, actual:null, forecast:null,
    dealValue:null, weight:null, owners:[], owner:0, ownerWarn:false, updated:null, rollup:false, perMonth:false, varTip:null, derive:null }, r);
  o.risk = Object.assign({ concentration:null, reporting:null, staffing:null }, r.risk || {});
  o.tips = r.tips || {};
  return o;
}
function normProj(p){ const o = Object.assign({ owner:"", deadline:null, stages:[], risk:{}, tips:{}, updated:null }, p); o.risk = Object.assign({ reporting:null, staffing:null }, p.risk || {}); return o; }
function normalize(d){
  d = clone(d);
  d.talent = d.talent || [];
  ["commercial","cost","talent"].forEach(k => (d[k] || []).forEach(s => { s.rows = (s.rows || []).map(normRow); }));
  d.operations = (d.operations || []).map(normProj);
  d.meta = Object.assign({ asOf:null, currency:"USD" }, d.meta || {});
  d.costModel = d.costModel || null;
  d.highlights = d.highlights || [];
  d.manual = d.manual || {};
  d = normDeep(d, curQuarter(d));
  if(d.opsNote == null) d.opsNote = "";
  return d;
}
function sections(d){ return [...d.commercial, ...d.cost, ...(d.talent || [])]; }
function allRows(d){ return sections(d).flatMap(s => s.rows); }
function findRow(d, id){ return allRows(d).find(r => r.id === id) || null; }
function findProj(d, id){ return d.operations.find(p => p.id === id) || null; }
function children(d, row){ return allRows(d).filter(r => r.parent === row.id); }
function ownerOf(r){ return r.owners[r.owner || 0] || null; }
function ownerRole(r){ const o = ownerOf(r); return o ? o.role : ""; }
function wi(d, row){ return d === S.live && S.view === "live" && !S.noWhatIf ? S.whatIf[row.id] : null; }
function wOf(d, row){ const x = wi(d, row); return x && "w" in x ? x.w : row.weight; }
function dvOf(d, row){ const x = wi(d, row); return x && "dv" in x ? x.dv : row.dealValue; }
function offOf(d, row){ const x = wi(d, row); return x && "off" in x ? !!x.off : !!row.off; }
function val(d, row, f){
  if(row.placeholder) return null;
  if(row.annualOf){ const s = findRow(d, row.annualOf), v = s ? val(d, s, f) : null; return blank(v) ? null : Math.round(v * 12 * 100) / 100; }
  if(row.model) return modelVal(d, row, f);
  if(row.derive){ const a = findRow(d, row.derive.num), b = findRow(d, row.derive.den); if(!a || !b) return null; const x = val(d, a, f), y = val(d, b, f); return blank(x) || blank(y) || !+y ? null : x / y; }
  const w = wOf(d, row), dv = dvOf(d, row);
  if(f === "forecast" && !blank(dv) && !blank(w)) return r1(+dv * +w / 100);
  if(f === row.field && row.owners.length){ const o = ownerOf(row); if(o && "value" in o) return blank(o.value) ? null : +o.value; }
  else if(!blank(row[f])) return +row[f];
  if(row.rollup){ const ch = children(d, row).filter(c => !offOf(d, c)).map(c => val(d, c, f)).filter(x => !blank(x)); if(ch.length) return r1(ch.reduce((a, b) => a + b, 0)); }
  return null;
}
function fmtV(row, v){
  if(blank(v)) return null;
  if(row.fmt === "unit") return unit$(v);
  if(row.fmt === "accounts") return r1(v) + "M";
  if(row.fmt === "count") return String(Math.round(v * 10) / 10);
  if(row.fmt === "k") return "$" + Math.round(v * 1000) + "k";
  if(row.fmt === "pct") return Math.round(v) + "%";
  return money(v);
}
function fmtDiff(row, v){
  if(row.fmt === "unit") return (v > 0 ? "+" : v < 0 ? MINUS : "") + "$" + Math.abs(v).toFixed(3);
  if(row.fmt === "accounts") return (v > 0 ? "+" : v < 0 ? MINUS : "") + r1(Math.abs(v)) + "M";
  if(row.fmt === "k") return (v > 0 ? "+" : v < 0 ? MINUS : "") + "$" + Math.round(Math.abs(v) * 1000) + "k";
  return smoney(v);
}
function varOf(d, row, which){
  const p = val(d, row, "plan"), v = val(d, row, which);
  if(blank(p) || blank(v)) return null;
  if(row.model && Math.abs(v - p) < 1e-9) return null;
  const raw = v - p, diff = row.fmt === "usd" ? r1(raw) : raw, pct = p ? raw / p * 100 : 0, rp = Math.round(pct);
  const adverse = row.better === "lower" ? diff > 1e-9 : diff < -1e-9;
  if(row.fmt === "count"){ const n = Math.round(diff); return { main: n === 0 ? "0" : (n > 0 ? "+" : MINUS) + Math.abs(n), sub: rp === 0 ? "0%" : (rp > 0 ? "+" : MINUS) + Math.abs(rp) + "%", adverse, diff, pct: rp }; }
  if(row.fmt === "pct"){ const pts = Math.round(raw); return { main: (pts > 0 ? "+" : pts < 0 ? MINUS : "") + Math.abs(pts) + " pts", sub: "", adverse, diff: raw, pct: rp }; }
  return { main: rp < 0 ? `(${-rp}%)` : rp > 0 ? `+${rp}%` : "0%", sub: row.varSub === false ? "" : fmtDiff(row, diff), adverse, diff, pct: rp };
}
function variance(d, row){ return varOf(d, row, "actual") || varOf(d, row, "forecast"); }

/* NorthPoint cost to serve, 5-year contract, from the deal model. Plan uses the model's 2026 estimate;
   forecast uses today's cloud cost per account from the Platform row above. */
function npCost(d, f){
  const m = d.costModel, ceil = x => Math.ceil(x - 1e-9);
  const am = m.accounts.map(a => +a * 12), tam = am.reduce((a, b) => a + b, 0);
  const envY = m.accounts.reduce((s, a) => s + Math.max(+m.envMin, ceil(+a / +m.envCapacity)), 0);
  const supY = m.accounts.reduce((s, a) => s + Math.max(+m.supportMin, ceil(+a / +m.supportCapacity)), 0);
  let cu = +m.cloudPerAcct;
  if(f === "forecast"){ const cr = findRow(d, "cloud-unit"), av = cr ? val(d, cr, "actual") : null; cu = !blank(av) ? av : cu * (1 + (+m.cloudPremium || 0) / 100); }
  const L = { cloud:{ unit:cu, vol:tam }, env:{ unit:+m.envCost, vol:envY }, lic:{ unit:+m.licPerAcct, vol:tam }, sup:{ unit:+m.supportCost, vol:supY }, impl:{ unit:+m.implRate, vol:+m.implMonths } };
  Object.values(L).forEach(x => { x.total = x.unit * x.vol; });
  const total = Object.values(L).reduce((s, x) => s + x.total, 0);
  const off = m.offers[S.offer] || m.offers.sales, rev = off.revenue.reduce((s, r, i) => s + +r * am[i], 0);
  return { L, total, rev, tam, offer: off, margin: rev ? (1 - total / rev) * 100 : null };
}
function modelVal(d, row, f){
  if(f === "actual") return null;
  const c = npCost(d, f), md = row.model;
  if(md.line === "margin") return f === "plan" ? +d.costModel.marginTarget : c.margin;
  if(md.line === "all") return c.total;
  const x = c.L[md.line]; return md.part === "unit" ? x.unit : md.part === "vol" ? x.vol : x.total;
}

/* What each cell shows; used for rendering and for marking draft changes. */
function cellData(d, row){
  const t = c => row.tips[c] || {};
  const o = ownerOf(row), vA = varOf(d, row, "actual"), vF = varOf(d, row, "forecast"), vt = row.varTip || {}, vtw = vt.which || "actual";
  return {
    metric:{ t: row.metric, sub: row.weighted ? `deal ${blank(dvOf(d, row)) ? "N/A" : money(dvOf(d, row))} at ${blank(wOf(d, row)) ? "N/A" : wOf(d, row) + "%"}` : "" },
    plan:{ t: fmtV(row, val(d, row, "plan")) }, actual:{ t: fmtV(row, val(d, row, "actual")) }, forecast:{ t: fmtV(row, val(d, row, "forecast")) },
    varA: vA ? Object.assign({}, vA, vtw === "actual" ? { tip: vt.text || "", esc: vt.esc || null } : { tip:"", esc:null }) : { main:null },
    varF: vF ? Object.assign({}, vF, vtw === "forecast" ? { tip: vt.text || "", esc: vt.esc || null } : { tip:"", esc:null }) : { main:null },
    annual:{ t: row.perMonth && vA ? smoney(vA.diff * 12) : null, adverse: vA && vA.adverse },
    concentration:{ st: row.risk.concentration, tip: t("concentration").text || "", esc: t("concentration").esc || null },
    reporting:{ st: row.risk.reporting, tip: t("reporting").text || "", esc: t("reporting").esc || null },
    staffing:{ st: row.risk.staffing, tip: t("staffing").text || "", esc: t("staffing").esc || null },
    owner:{ t: o ? o.role : (row.model || row.derive ? "" : "None"), sub: o ? o.source : "", warn: row.ownerWarn || (!o && !row.model && !row.derive) || (o && o.unreliable) },
    source:{ t: row.owners.map(x => x.source).join(", "), bad: !!(o && o.unreliable) },
    all:{ t: row.owners.map(x => `${x.role}${"value" in x ? " " + x.value : ""}${x.unreliable ? " unreliable" : ""}`).join("; ") + (row.owners.length > 1 && row.showAll === false ? " (main only shown)" : "") },
    inc:{ t: row.weighted && offOf(d, row) ? "Excluded from pipeline" : "" },
    updated:{ t: fmtDate(row.updated), stale: !!row.updated && !!d.meta.asOf && row.updated < d.meta.asOf }
  };
}
function cellText(c){
  if(!c) return "";
  if("st" in c) return c.st ? STATUS[c.st] + (c.tip ? " · " + c.tip : "") : "";
  if("main" in c) return (c.main || "") + (c.sub ? " " + c.sub : "") + (c.tip ? " · " + c.tip : "");
  return [c.t, c.sub].filter(Boolean).join(" ");
}

/* ---------- other issues (rule-based fallback; AI replaces these when connected) ---------- */
function knownFigures(d){
  const k = new Set(); const addM = v => { if(!blank(v)){ const m = money(Math.abs(+v)); if(m) k.add(m); } };
  allRows(d).forEach(r => {
    if(r.fmt === "usd"){ ["plan","actual","forecast"].forEach(f => addM(val(d, r, f))); r.owners.forEach(o => addM(o.value)); addM(r.dealValue); }
    if(!blank(r.weight)) k.add(+r.weight + "%");
    ["actual","forecast"].forEach(w => { const v = varOf(d, r, w); if(v){ k.add(Math.abs(v.pct) + "%"); if(r.fmt === "usd") addM(Math.abs(v.diff)); } });
    if(r.rollup){ const tot = val(d, r, "forecast"); if(+tot) children(d, r).forEach(c => { const cv = val(d, c, "forecast"); if(!blank(cv)) k.add(Math.round(cv / tot * 100) + "%"); }); }
  });
  d.operations.forEach(p => { if(p.kpi && p.kpi.plan){ const dd = p.kpi.actual - p.kpi.plan; k.add(Math.abs(Math.round(dd / p.kpi.plan * 100)) + "%"); } });
  return k;
}
function escalatedCols(d){
  const out = [];
  allRows(d).forEach(r => { Object.entries(r.tips).forEach(([c, t]) => { if(t && t.esc) out.push({ id:r.id, name:r.metric, col:c, parent:r.parent }); }); if(r.varTip && r.varTip.esc) out.push({ id:r.id, name:r.metric, col:"var", parent:r.parent }); });
  d.operations.forEach(p => Object.entries(p.tips).forEach(([c, t]) => { if(t && t.esc) out.push({ id:p.id, name:p.name, col:c, proj:true }); }));
  return out;
}
function covered(d, id, name, col, parent){
  const nm = String(name).toLowerCase();
  return escalatedCols(d).some(e => e.col === col && (e.id === id || e.id === parent || (nm.length > 4 && (e.name.toLowerCase().includes(nm) || nm.includes(e.name.toLowerCase())))));
}
function ruleIssues(d){
  const out = [], rb = fmtDow(S.ops.settings.replyBy);
  allRows(d).forEach(r => {
    if(r.model || r.derive || r.placeholder || r.annualOf) return;
    const reasons = []; let sev = "medium", topic = r.fmt === "count" ? "Talent" : "Data reporting", impact = "";
    const shown = fmtV(r, val(d, r, r.field));
    const vals = r.owners.filter(x => "value" in x && !blank(x.value)), empty = r.owners.filter(x => "value" in x && blank(x.value));
    const disagree = vals.length > 1 && uniq(vals.map(x => +x.value)).length > 1;
    if(r.child && !disagree) return; // sub-rows are covered by their parent's issue
    if(disagree){
      const good = vals.find(x => !x.unreliable) || vals[0], bad = vals.find(x => x !== good), gap = Math.abs(+bad.value - +good.value);
      const pl = val(d, r, "plan"), lo = Math.min(+bad.value, +good.value), hi = Math.max(+bad.value, +good.value);
      out.push({ title: `${r.metric}: Finance and Sales figures differ`, category: "Data reporting", severity: "high", keep: true,
        issue: `${bad.role} reports ${fmtV(r, bad.value)} (${bad.source}) while ${good.role} reports ${fmtV(r, good.value)} (${good.source}), a ${fmtV(r, gap)} difference.`,
        impact: !blank(pl) && hi < pl ? `Until the two are reconciled, the shortfall against the ${fmtV(r, pl)} plan could be anywhere from ${fmtV(r, pl - hi)} to ${fmtV(r, pl - lo)}.` : `Until the two are reconciled, the ${r.metric} shown may not be the agreed number.`,
        next: `Ask ${bad.role} to reconcile the ${bad.source} with the ${good.source} and agree ${good.role} as the single source by ${rb}.`, rowIds:[r.id] });
      return;
    }
    if(disagree) reasons.push(vals.map(x => `${x.role} reports ${fmtV(r, x.value)} (${x.source})`).join(", "));
    empty.forEach(x => reasons.push(`${x.role} has no figure (${x.source})`));
    COLS.forEach(([c]) => { const st = r.risk[c], t = r.tips[c] || {};
      if(!st || st === "green" || t.esc || covered(d, r.id, r.metric, c, r.parent)) return;
      if(t.text && !reasons.some(x => x.includes(t.text))) reasons.push(t.text); if(st === "red") sev = "high"; });
    if(r.weighted && blank(r.dealValue) && !blank(val(d, r, "forecast"))) reasons.push("no deal value or weight behind the weighted figure");
    const mo = ownerOf(r), warnOwn = r.ownerWarn && mo && !covered(d, r.id, r.metric, "reporting", r.parent);
    if(warnOwn){ reasons.splice(0, reasons.length, `${r.metric} is reported by ${mo.role} from ${/^spreadsheet/i.test(mo.source) ? "a spreadsheet" : mo.source}, not by Finance`); topic = "Ownership"; }
    const v = varOf(d, r, "actual");
    if(r.perMonth && v && v.adverse && Math.abs(v.pct) >= 10){ reasons.unshift(`running ${v.main} over plan`); topic = "Cost"; impact = `At this rate it adds ${smoney(v.diff * 12)} a year over plan.`; sev = Math.abs(v.pct) >= 20 ? "high" : "medium"; }
    if(r.fmt === "count" && v && v.adverse && !reasons.length) reasons.push(`${fmtV(r, val(d, r, "actual"))} against a plan of ${fmtV(r, val(d, r, "plan"))} (${v.sub})`);
    if(!reasons.length) return;
    if(!impact){
      if(warnOwn) impact = `The ${shown || "figure"} shown has not been checked or reported by Finance.`;

  const a = e.target.closest("[data-act]");
  if(!a){
    if(e.target.isContentEditable || e.target.closest("input,select,textarea,a")) return;
    if(e.target.closest(".cf, .nb, .cbar")) return;
    const hlc = e.target.closest(".hlc[data-hl]"); if(hlc){ const k = "hl" + hlc.dataset.hl; if(S.focus === k) clearFocus(); else setFocus("hl", +hlc.dataset.hl, true); return; }
    const card = e.target.closest(".card[data-card]"); if(card){ const k = "esc" + card.dataset.card; if(S.focus === k) clearFocus(); else setFocus("esc", +card.dataset.card, true); return; }
    const li = e.target.closest("li[data-issue]"); if(li){ const k = "iss" + li.dataset.issue; if(S.focus === k) clearFocus(); else setFocus("iss", +li.dataset.issue, true); return; }
    if(S.focus && !e.target.closest("#focusbar")) clearFocus();
    return;
  }
  const m = S.modal;
  switch(a.dataset.act){
    case "view": S.view = a.dataset.v; S.pubConfirm = S.discardConfirm = false; S.focus = null; renderBar(); renderDashboard(); if(S.view === "draft"){ maybeAI("draft"); suggestNow(false); } break;
    case "unlock": { delete S.draft.manual[a.dataset.key]; suggestNow(true); renderDashboard(); saveDraft(); break; }
    case "suggest": suggestNow(true); break;
    case "versions": S.vmenu = !S.vmenu; S.restoreAsk = null; renderBar(); if(!S.vmenu) renderVMenu(); break;
    case "restore": S.restoreAsk = +a.dataset.v; renderVMenu(); break;
    case "restore-no": S.restoreAsk = null; renderVMenu(); break;
    case "restore-go": await restoreVersion(+a.dataset.v); break;
    case "unfocus": clearFocus(); break;
    case "flag": { const r = findRow(S.draft, a.dataset.rid), o = r && r.owners[+a.dataset.i]; if(o){ o.unreliable = !o.unreliable; dirty(true); } break; }
    case "mainowner": { const r = findRow(S.draft, a.dataset.rid); if(r){ r.owner = +a.dataset.i; dirty(true); } break; }
    case "wif-reset": S.whatIf = {}; renderDashboard(); break;
    case "sec": { const k = a.dataset.sec; S.collapsed[k] = !S.collapsed[k]; savePrefs(); renderDashboard(); break; }
    case "issues": S.issuesOpen = !S.issuesOpen; savePrefs(); if(S.focus && S.focus.startsWith("iss")) clearFocus(); renderIssues(); break;
    case "ai-refresh": maybeAI(S.view === "draft" ? "draft" : "live", true); break;
    case "follow": openModal(a.dataset.ref); break;
    case "rowtog": { const k = "r:" + a.dataset.rid; S.collapsed[k] = !S.collapsed[k]; savePrefs(); renderDashboard(); break; }
    case "fuhist": S.fuOpen[a.dataset.id] = !S.fuOpen[a.dataset.id]; renderHighlights(cur()); renderCards(cur()); renderIssues(); renderResolved(); break;
    case "notes": S.modal = null; S.nmodal = { ref: a.dataset.ref, text: "", by: noteBy(), focus: true }; renderNotesModal(); break;
    case "nclose": closeModal(); break;
    case "nsave": await saveNote(); break;
    case "resolve": await resolveRef(a.dataset.ref); break;
    case "reopen": await reopenRef(a.dataset.ref); break;
    case "resolvedtog": S.resolvedOpen = !S.resolvedOpen; renderResolved(); break;
    case "fureply": { const m2 = S.ops.outbox.find(x => x.id === a.dataset.mid); if(m2){ if(a.dataset.v === "1") m2.replied = { at: new Date().toISOString() }; else delete m2.replied; saveOps(); renderHighlights(cur()); renderCards(cur()); renderIssues(); renderResolved(); if(S.modal) renderModal(); } break; }
    case "pub": S.pubConfirm = true; renderDraftbar(); break;
    case "discard": S.discardConfirm = true; renderDraftbar(); break;
    case "cancel": S.pubConfirm = S.discardConfirm = false; renderDraftbar(); break;
    case "pub-go": await publish(); break;
    case "discard-go": S.draft = clone(S.live); S.discardConfirm = false; renderAll(); saveDraft(); toast("Draft reset to what the President sees."); break;
    case "mclose": closeModal(); break;
    case "mto": m.toOpen = !m.toOpen; m.ccOpen = false; renderModal(); break;
    case "mcc": m.ccOpen = !m.ccOpen; m.toOpen = false; renderModal(); break;
    case "mcontacts": m.contacts = !m.contacts; renderModal(); break;
    case "msend": m.confirm = true; m.toOpen = false; renderModal(); break;
    case "mcancel": m.confirm = false; renderModal(); break;
    case "msend-go": await sendModal(); break;
  }
});

/* ---------- persistence, versions, AI ---------- */
let saveT = null, opsT = null, aiT = null;
function setSaved(t){ const e = $("#saveSt"); if(e) e.textContent = t; }
function dirty(rerender){ if(rerender){ renderDashboard(); renderBar(); } else { const b = $("#chgN"); if(b) b.textContent = diffCount(); } saveDraft(); scheduleSuggest(); }
function saveLocal(){ try{ localStorage.setItem(LSKEY, JSON.stringify({ live:S.live, draft:S.draft, ops:S.ops, history:S.history, notes:S.notes, resolved:S.resolved })); }catch(e){} }
function saveDraft(){
  setSaved("Saving…"); clearTimeout(saveT);
  saveT = setTimeout(async () => {
    if(S.mode === "server"){ try{ await api("draft", { method:"PUT", body: JSON.stringify({ draft:S.draft }) }); setSaved("Saved"); if(S.issues.draft) S.issues.draft.stale = true; scheduleAI(); }catch(e){ setSaved("Not saved: " + e.message); } }
    else { saveLocal(); setSaved("Saved in this browser"); renderIssues(); }
  }, 600);
}
function saveOps(){ clearTimeout(opsT); opsT = setTimeout(async () => { if(S.mode === "server"){ try{ await api("ops", { method:"PUT", body: JSON.stringify({ ops:S.ops }) }); }catch(e){ toast("Contacts not saved: " + e.message); } } else saveLocal(); }, 400); }
function scheduleAI(){ if(!S.ai.enabled){ renderIssues(); return; } clearTimeout(aiT); aiT = setTimeout(() => maybeAI("draft"), 5000); }
async function maybeAI(which, force){
  if(S.mode !== "server" || !S.ai.enabled){ renderIssues(); return; }
  const c = S.issues[which]; if(!force && c && !c.stale && c.items) return;
  S.aiBusy = true; renderIssues();
  try{ const res = await api("ai/issues", { method:"POST", body: JSON.stringify({ which, force: !!force }) }); S.issues[which] = res; }
  catch(e){ if(force) toast("AI couldn't refresh the issues: " + e.message); }
  S.aiBusy = false; renderIssues();
}
function histEntry(live, note){ return { version: live.version, at: live.publishedAt, by: live.publishedBy, note: note || "", snapshot: clone(live) }; }
async function publish(){
  if(S.mode === "server"){
    S.draft = normDeep(S.draft, curQuarter(S.draft));
    try{ const res = await api("publish", { method:"POST", body: JSON.stringify({ draft:S.draft }) }); S.live = normalize(res.live); S.draft = normalize(res.live); if(res.issues) S.issues.live = res.issues; if(res.history) S.history = res.history; }
    catch(e){ toast("Not published: " + e.message); return; }
  } else {
    const live = Object.assign(normDeep(clone(S.draft), curQuarter(S.draft)), { version:(S.live.version || 1) + 1, publishedAt: new Date().toISOString(), publishedBy:"You (preview)" });
    if(!S.history.some(x => x.version === S.live.version)) S.history.unshift(histEntry(S.live));
    S.history.unshift(histEntry(live)); S.live = normalize(live); S.draft = normalize(live); saveLocal();
  }
  S.pubConfirm = false; S.view = "live"; renderAll();
  toast(`Published ${verLabel(S.live.version)}. The President now sees these figures.`);
}
async function restoreVersion(v){
  if(S.mode === "server"){
    try{ const res = await api("restore", { method:"POST", body: JSON.stringify({ version: v }) }); S.live = normalize(res.live); S.draft = normalize(res.live); S.history = res.history || S.history; }
    catch(e){ toast("Not restored: " + e.message); return; }
  } else {
    const h0 = S.history.find(x => x.version === v); if(!h0 || !h0.snapshot){ toast("That version isn't stored in this preview."); return; }
    if(!S.history.some(x => x.version === S.live.version)) S.history.unshift(histEntry(S.live));
    const live = Object.assign(clone(h0.snapshot), { version: S.live.version + 1, publishedAt: new Date().toISOString(), publishedBy: "You (preview)" });
    S.history.unshift(histEntry(live, `Restored from ${verLabel(v)}`)); S.live = normalize(live); S.draft = normalize(live); saveLocal();
  }
  S.vmenu = false; S.restoreAsk = null; S.view = "live"; renderAll();
  toast(`${verLabel(v)} is live again as ${verLabel(S.live.version)}.`);
}
async function api(path, opts = {}){
  const r = await fetch("/api/" + path, Object.assign({ headers:{ "content-type":"application/json" }, credentials:"same-origin" }, opts));
  if(r.status === 401 && r.headers.get("x-login") === "1"){ location.reload(); throw new Error("Please sign in again."); }
  let j = null; try{ j = await r.json(); }catch(e){ throw new Error("No dashboard server here"); }
  if(!r.ok) throw new Error((j && j.error) || r.statusText);
  return j;
}
let toastT = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }

/* ---------- boot ---------- */
function mergeOps(o){
  const d = clone(OPS_DEFAULT); if(!o) return d;
  const same = o.dirV === d.dirV;
  return { dirV: d.dirV, directory: same && o.directory ? o.directory : d.directory, settings: Object.assign(d.settings, o.settings || {}, same ? {} : { cc: "", senderName: d.settings.senderName, senderEmail: d.settings.senderEmail }), outbox: o.outbox || [] };
}
function valid(x){ return !!(x && x.commercial && x.operations); }
async function boot(){
  loadPrefs();
  S.live = normalize(DATA); S.draft = normalize(DATA); S.ops = clone(OPS_DEFAULT); S.history = [histEntry(S.live, "Q3 tracker extract")];
  try{ const j = JSON.parse(localStorage.getItem(LSKEY) || "null"); if(j && valid(j.live)){ S.live = normalize(j.live); S.draft = normalize(valid(j.draft) ? j.draft : j.live); S.ops = mergeOps(j.ops); S.history = j.history || S.history; S.notes = j.notes || {}; S.resolved = j.resolved || {}; } }catch(e){}
  renderAll();
  try{
    const st = await Promise.race([api("state"), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 6000))]);
    S.mode = "server"; S.me = st.me || S.me; S.mail = st.mail || S.mail; S.ai = st.ai || S.ai;
    if((!valid(st.live) || (st.live.schema || 0) < DATA.schema) && S.me.admin) Object.assign(st, await api("init", { method:"POST", body: JSON.stringify({ live: normalize(DATA), draft: normalize(DATA), ops: mergeOps(st.ops) }) }));
    if(!valid(st.live)) throw new Error("No published data yet.");
    S.live = normalize(st.live); S.draft = normalize(valid(st.draft) ? st.draft : st.live); S.ops = mergeOps(st.ops); S.issues = st.issues || S.issues; S.history = st.history || []; S.notes = st.notes || {}; S.resolved = st.resolved || {};
    if(st.ops && st.ops.dirV !== OPS_DEFAULT.dirV && S.me.admin) saveOps();
    renderAll();
    maybeAI("live");
  }catch(e){ if(S.mode !== "server"){ S.mode = "demo"; S.me = { admin:true, email:"", setup:false }; } renderBar(); }
}
boot();
</script>
